note: >-
  Amazon Lightsail ships no standalone SDK. Every first-party client is a per-service module inside the
  AWS SDK for that language, generated from the same Smithy 2.0 service model captured in smithy/ and
  released on the AWS SDK's own near-daily train — which is why every version below was published within
  three days of this probe. Three languages carry Lightsail inside an aggregate package instead of a
  per-service artifact: Python (boto3, client name "lightsail"), PHP (aws/aws-sdk-php) and the AWS CLI
  (`aws lightsail`, see cli/).
