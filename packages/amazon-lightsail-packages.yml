currency:
  assessment: current
  note: >-
    Every Lightsail client module was republished within six days of this probe. There is no abandonment
    signal here, and there cannot be a useful one: the AWS SDKs regenerate from the Smithy model in
    smithy/ on a near-daily release train shared by ~400 services, so an SDK release date measures the
    train, not Lightsail's own activity. The dated signal that DOES track Lightsail is the documentation
    history in changelog/, whose most recent entry is 2025-10-31.
