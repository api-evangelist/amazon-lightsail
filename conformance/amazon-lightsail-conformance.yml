note: >-
  Virtual private server hosting has no market-wide interface standard — there is no SCIM, FHIR, OData
  or OpenRTB equivalent for "launch me a VPS", and the closest thing to one (OpenStack Compute, CIMI)
  is not something Lightsail claims or implements. So domain_standard is recorded as absent rather than
  stretched to fit, which under the reward-only rule costs Lightsail nothing. What Lightsail does
  conform to is AWS's own house protocol: AWS JSON 1.1 over SigV4, self-described in a Smithy 2.0 model
  AWS publishes at github.com/aws/api-models-aws — a real, versioned, machine-readable contract that
  most of this catalog's providers do not have, even though it is not an OpenAPI. The compliance
  certifications below are AWS-wide programs that cover Lightsail as an in-scope service; they are
  attested by AWS Artifact, not by a Lightsail-specific audit.
