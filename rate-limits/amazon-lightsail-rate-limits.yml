provider: Amazon Lightsail
providerId: amazon-lightsail
note: 'Two different things are usually collapsed into ''rate limits'' and Lightsail publishes only one of
  them. There is NO published request-rate limit: AWS documents no requests-per-second figure, no burst, no
  window and no RateLimit-* or X-RateLimit-* response headers for Lightsail, and the API returns no such header
  on an unauthenticated probe. The only runtime throttling signal is the error itself — a ThrottlingException
  carrying HTTP status 400, NOT 429, which is the detail most likely to break a generic retry handler, since
  a 400 normally means ''do not retry''. AWS SDKs special-case it and retry with exponential backoff. What
  Lightsail DOES publish, and publishes well, is 34 resource service quotas — per-Region, per-account ceilings
  on how many instances, disks, distributions and so on an account may hold. Two of them are adjustable through
  the Service Quotas console. Those are recorded below as quotas, not as rate limits, because an agent pacing
  its calls cannot use them.'
