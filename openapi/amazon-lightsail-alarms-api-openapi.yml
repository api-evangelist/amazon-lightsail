  /ls/api/2016-11-28/GetAlarms:
    get:
      operationId: GetAlarms
      summary: Returns information about the configured alarms
      description: Returns information about the configured alarms. Specify an alarm name in your request to return information about a specific alarm, or specify a monitored resource name to return information about all alarms for a specific resource. An alarm is used to monitor a single metric for one of your resources. When a metric condition is met, the alarm can notify you by email, SMS text message, and a banner displayed on the Amazon Lightsail console. For more information, see Alarms in Amazon Lightsail .
      tags:
      - Alarms
      parameters:
      - name: alarmName
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ResourceName'
        description: The name of the alarm. Specify an alarm name to return information about a specific alarm.
      - name: pageToken
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/string'
        description: The token to advance to the next page of results from your request. To get a page token, perform an initial GetAlarms request. If your results are paginated, the response will return a next page token that you can specify as the page token in a subsequent request.
      - name: monitoredResourceName
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ResourceName'
        description: The name of the Lightsail resource being monitored by the alarm. Specify a monitored resource name to return information about all alarms for a specific resource.
      responses:
        '200':
          description: Success
          content:
            application/x-amz-json-1.1:
              schema:
                $ref: '#/components/schemas/GetAlarmsResult'
        '403':
