components:
  schemas:
    AccessDeniedException:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/string'
        docs:
          $ref: '#/components/schemas/string'
        message:
          $ref: '#/components/schemas/string'
        tip:
          $ref: '#/components/schemas/string'
      description: Lightsail throws this exception when the user cannot be authenticated or uses invalid credentials to access a resource.
    GetInstanceResult:
      type: object
      properties:
        instance:
          allOf:
          - $ref: '#/components/schemas/Instance'
          description: An array of key-value pairs containing information about the specified instance.
    AddOnRequest:
      type: object
      properties:
        addOnType:
          allOf:
          - $ref: '#/components/schemas/AddOnType'
          description: The add-on type.
        autoSnapshotAddOnRequest:
          allOf:
          - $ref: '#/components/schemas/AutoSnapshotAddOnRequest'
          description: An object that represents additional parameters when enabling or modifying the automatic snapshot add-on.
        stopInstanceOnIdleRequest:
          allOf:
          - $ref: '#/components/schemas/StopInstanceOnIdleRequest'
          description: An object that represents additional parameters when enabling or modifying the StopInstanceOnIdle add-on. This object only applies to Lightsail for Research resources.
      required:
      - addOnType
      description: Describes a request to enable, modify, or disable an add-on for an Amazon Lightsail resource. An additional cost may be associated with enabling add-ons. For more information, see the Lightsail pricing page .
    HttpProtocolIpv6:
      type: string
      enum:
      - disabled
      - enabled
    MetricStatisticList:
      type: array
      items:
        $ref: '#/components/schemas/MetricStatistic'
    InstanceHardware:
      type: object
      properties:
        cpuCount:
          allOf:
          - $ref: '#/components/schemas/integer'
          description: The number of vCPUs the instance has.
        disks:
          allOf:
          - $ref: '#/components/schemas/DiskList'
          description: The disks attached to the instance.
        ramSizeInGb:
          allOf:
          - $ref: '#/components/schemas/float'
          description: The amount of RAM in GB on the instance ( 1.0 ).
      description: Describes the hardware for the instance.
    InstancePortInfoList:
      type: array
      items:
        $ref: '#/components/schemas/InstancePortInfo'
    GetInstancesRequest:
      type: object
      properties:
        pageToken:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The token to advance to the next page of results from your request. To get a page token, perform an initial GetInstances request. If your results are paginated, the response will return a next page token that you can specify as the page token in a subsequent request.
    OperationFailureException:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/string'
        docs:
          $ref: '#/components/schemas/string'
        message:
          $ref: '#/components/schemas/string'
        tip:
          $ref: '#/components/schemas/string'
      description: Lightsail throws this exception when an operation fails to execute.
    GetInstanceAccessDetailsResult:
      type: object
      properties:
        accessDetails:
          allOf:
          - $ref: '#/components/schemas/InstanceAccessDetails'
          description: An array of key-value pairs containing information about a get instance access request.
    MetricDatapoint:
      type: object
      properties:
        average:
          allOf:
          - $ref: '#/components/schemas/double'
          description: The average.
        maximum:
          allOf:
          - $ref: '#/components/schemas/double'
          description: The maximum.
        minimum:
          allOf:
          - $ref: '#/components/schemas/double'
          description: The minimum.
        sampleCount:
          allOf:
          - $ref: '#/components/schemas/double'
          description: The sample count.
        sum:
          allOf:
          - $ref: '#/components/schemas/double'
          description: The sum.
        timestamp:
          allOf:
          - $ref: '#/components/schemas/timestamp'
          description: The timestamp ( 1479816991.349 ).
        unit:
          allOf:
          - $ref: '#/components/schemas/MetricUnit'
          description: The unit.
      description: Describes the metric data point.
    StopInstanceOnIdleRequest:
      type: object
      properties:
        threshold:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The value to compare with the duration.
        duration:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The amount of idle time in minutes after which your virtual computer will automatically stop.
      description: Describes a request to create or edit the StopInstanceOnIdle add-on. This add-on only applies to Lightsail for Research resources.
    AddOn:
      type: object
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The name of the add-on.
        status:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The status of the add-on.
        snapshotTimeOfDay:
          allOf:
          - $ref: '#/components/schemas/TimeOfDay'
          description: The daily time when an automatic snapshot is created. The time shown is in HH:00 format, and in Coordinated Universal Time (UTC). The snapshot is automatically created between the time shown and up to 45 minutes after.
        nextSnapshotTimeOfDay:
          allOf:
          - $ref: '#/components/schemas/TimeOfDay'
          description: The next daily time an automatic snapshot will be created. The time shown is in HH:00 format, and in Coordinated Universal Time (UTC). The snapshot is automatically created between the time shown and up to 45 minutes after.
        threshold:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The trigger threshold of the action. This add-on only applies to Lightsail for Research resources.
        duration:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The amount of idle time in minutes after which your virtual computer will automatically stop. This add-on only applies to Lightsail for Research resources.
      description: Describes an add-on that is enabled for an Amazon Lightsail resource.
    OpenInstancePublicPortsResult:
      type: object
      properties:
        operation:
          allOf:
          - $ref: '#/components/schemas/Operation'
          description: An array of objects that describe the result of the action, such as the status of the request, the timestamp of the request, and the resources affected by the request.
    TagList:
      type: array
      items:
        $ref: '#/components/schemas/Tag'
    SetupDomainNameList:
      type: array
      items:
        $ref: '#/components/schemas/SetupDomainName'
    EmailAddress:
      type: string
      pattern: ^[\w!#$%&.'*+\/=?^_\x60{|}~\-]{1,64}@[a-zA-Z0-9\-]{1,63}(\.[a-zA-Z0-9\-]{1,63}){0,8}(\.[a-zA-Z]{2,63})$
      minLength: 6
      maxLength: 254
    UnauthenticatedException:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/string'
        docs:
          $ref: '#/components/schemas/string'
        message:
          $ref: '#/components/schemas/string'
        tip:
          $ref: '#/components/schemas/string'
      description: Lightsail throws this exception when the user has not been authenticated.
    DiskState:
      type: string
      enum:
      - pending
      - error
      - available
      - in-use
      - unknown
    PortAccessType:
      type: string
      enum:
      - Public
      - Private
    HostKeysList:
      type: array
      items:
        $ref: '#/components/schemas/HostKeyAttributes'
    float:
      type: number
    AddOnList:
      type: array
      items:
        $ref: '#/components/schemas/AddOn'
    InstanceList:
      type: array
      items:
        $ref: '#/components/schemas/Instance'
    PutInstancePublicPortsRequest:
      type: object
      properties:
        portInfos:
          allOf:
          - $ref: '#/components/schemas/PortInfoList'
          description: An array of objects to describe the ports to open for the specified instance.
        instanceName:
          allOf:
          - $ref: '#/components/schemas/ResourceName'
