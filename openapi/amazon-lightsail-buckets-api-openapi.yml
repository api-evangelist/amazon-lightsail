components:
  schemas:
    BucketAccessLogPrefix:
      type: string
      pattern: ^[\w/!.*')(-]+$
      minLength: 1
      maxLength: 100
    TagValue:
      type: string
    MetricUnit:
      type: string
      enum:
      - Seconds
      - Microseconds
      - Milliseconds
      - Bytes
      - Kilobytes
      - Megabytes
      - Gigabytes
      - Terabytes
      - Bits
      - Kilobits
      - Megabits
      - Gigabits
      - Terabits
      - Percent
      - Count
      - Bytes/Second
      - Kilobytes/Second
      - Megabytes/Second
      - Gigabytes/Second
      - Terabytes/Second
      - Bits/Second
      - Kilobits/Second
      - Megabits/Second
      - Gigabits/Second
      - Terabits/Second
      - Count/Second
      - None
    RegionSetupInProgressException:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/string'
        docs:
          allOf:
          - $ref: '#/components/schemas/string'
          description: Regions and Availability Zones for Lightsail
        message:
          $ref: '#/components/schemas/string'
        tip:
          allOf:
          - $ref: '#/components/schemas/string'
          description: Opt-in Regions typically take a few minutes to finish setting up before you can work with them. Wait a few minutes and try again.
      description: Lightsail throws this exception when an operation is performed on resources in an opt-in Region that is currently being set up.
    GetBucketBundlesRequest:
      type: object
      properties:
        includeInactive:
          allOf:
          - $ref: '#/components/schemas/boolean'
          description: A Boolean value that indicates whether to include inactive (unavailable) bundles in the response of your request.
    double:
      type: number
    IsoDate:
      type: string
      format: date-time
    ResourceName:
      type: string
      pattern: ^\w[\w\-]*\w$
    Bucket:
      type: object
      properties:
        resourceType:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The Lightsail resource type of the bucket.
        accessRules:
          allOf:
          - $ref: '#/components/schemas/AccessRules'
          description: An object that describes the access rules of the bucket.
        arn:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The Amazon Resource Name (ARN) of the bucket.
        bundleId:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The ID of the bundle currently applied to the bucket. A bucket bundle specifies the monthly cost, storage space, and data transfer quota for a bucket. Use the UpdateBucketBundle action to change the bundle of a bucket.
        createdAt:
          allOf:
          - $ref: '#/components/schemas/IsoDate'
          description: The timestamp when the distribution was created.
        url:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The URL of the bucket.
        location:
          allOf:
          - $ref: '#/components/schemas/ResourceLocation'
          description: An object that describes the location of the bucket, such as the Amazon Web Services Region and Availability Zone.
        name:
          allOf:
          - $ref: '#/components/schemas/BucketName'
          description: The name of the bucket.
        supportCode:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The support code for a bucket. Include this code in your email to support when you have questions about a Lightsail bucket. This code enables our support team to look up your Lightsail information more easily.
        tags:
          allOf:
          - $ref: '#/components/schemas/TagList'
          description: The tag keys and optional values for the bucket. For more information, see Tags in Amazon Lightsail in the Amazon Lightsail Developer Guide .
        objectVersioning:
          allOf:
