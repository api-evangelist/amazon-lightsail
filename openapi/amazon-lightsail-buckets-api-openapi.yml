        $ref: '#/components/schemas/BucketCorsAllowedMethod'
    GetBucketsRequest:
      type: object
      properties:
        bucketName:
          allOf:
          - $ref: '#/components/schemas/BucketName'
          description: The name of the bucket for which to return information. When omitted, the response includes all of your buckets in the Amazon Web Services Region where the request is made.
        pageToken:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The token to advance to the next page of results from your request. To get a page token, perform an initial GetBuckets request. If your results are paginated, the response will return a next page token that you can specify as the page token in a subsequent request.
        includeConnectedResources:
          allOf:
          - $ref: '#/components/schemas/boolean'
          description: A Boolean value that indicates whether to include Lightsail instances that were given access to the bucket using the SetResourceAccessForBucket action.
        includeCors:
          allOf:
          - $ref: '#/components/schemas/boolean'
          description: A Boolean value that indicates whether to include Lightsail bucket CORS configuration in the response. For more information, see Configuring cross-origin resource sharing (CORS) . This parameter is only supported when getting a single bucket with bucketName specified. The default value for this parameter is False .
    TagKey:
      type: string
    string:
      type: string
    IAMAccessKeyId:
      type: string
      pattern: ^[A-Z0-9]{20}$
      minLength: 20
      maxLength: 20
    DeleteBucketAccessKeyResult:
      type: object
      properties:
        operations:
          allOf:
          - $ref: '#/components/schemas/OperationList'
          description: An array of objects that describe the result of the action, such as the status of the request, the timestamp of the request, and the resources affected by the request.
    DeleteBucketRequest:
      type: object
      properties:
        bucketName:
          allOf:
          - $ref: '#/components/schemas/BucketName'
          description: The name of the bucket to delete. Use the GetBuckets action to get a list of bucket names that you can specify.
        forceDelete:
          allOf:
          - $ref: '#/components/schemas/boolean'
          description: 'A Boolean value that indicates whether to force delete the bucket. You must force delete the bucket if it has one of the following conditions: The bucket is the origin of a distribution. The bucket has instances that were granted access to it using the SetResourceAccessForBucket action. The bucket has objects. The bucket has access keys. Force deleting a bucket might impact other resources that rely on the bucket, such as instances, distributions, or software that use the issued access keys.'
      required:
      - bucketName
    BucketCorsRules:
      type: array
      items:
        $ref: '#/components/schemas/BucketCorsRule'
    DeleteBucketAccessKeyRequest:
      type: object
      properties:
        bucketName:
          allOf:
          - $ref: '#/components/schemas/BucketName'
          description: The name of the bucket that the access key belongs to.
        accessKeyId:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The ID of the access key to delete. Use the GetBucketAccessKeys action to get a list of access key IDs that you can specify.
      required:
      - bucketName
      - accessKeyId
    PartnerIdList:
      type: array
      items:
        $ref: '#/components/schemas/NonEmptyString'
    float:
      type: number
    GetBucketMetricDataRequest:
      type: object
      properties:
        bucketName:
          allOf:
          - $ref: '#/components/schemas/BucketName'
          description: The name of the bucket for which to get metric data.
        metricName:
          allOf:
          - $ref: '#/components/schemas/BucketMetricName'
          description: 'The metric for which you want to return information. Valid bucket metric names are listed below, along with the most useful statistics to include in your request, and the published unit value. These bucket metrics are reported once per day. BucketSizeBytes - The amount of data in bytes stored in a bucket. This value is calculated by summing the size of all objects in the bucket (including object versions), including the size of all parts for all incomplete multipart uploads to the bucket. Statistics: The most useful statistic is Maximum . Unit: The published unit is Bytes . NumberOfObjects - The total number of objects stored in a bucket. This value is calculated by counting all objects in the bucket (including object versions) and the total number of parts for all incomplete multipart uploads to the bucket. Statistics: The most useful statistic is Average . Unit: The published unit is Count .'
        startTime:
          allOf:
          - $ref: '#/components/schemas/IsoDate'
          description: The timestamp indicating the earliest data to be returned.
        endTime:
          allOf:
          - $ref: '#/components/schemas/IsoDate'
          description: The timestamp indicating the latest data to be returned.
        period:
          allOf:
          - $ref: '#/components/schemas/MetricPeriod'
          description: The granularity, in seconds, of the returned data points. Bucket storage metrics are reported once per day. Therefore, you should specify a period of 86400 seconds, which is the number of seconds in a day.
        statistics:
          allOf:
          - $ref: '#/components/schemas/MetricStatisticList'
          description: 'The statistic for the metric. The following statistics are available: Minimum - The lowest value observed during the specified period. Use this value to determine low volumes of activity for your application. Maximum - The highest value observed during the specified period. Use this value to determine high volumes of activity for your application. Sum - The sum of all values submitted for the matching metric. You can use this statistic to determine the total volume of a metric. Average - The value of Sum / SampleCount during the specified period. By comparing this statistic with the Minimum and Maximum values, you can determine the full scope of a metric and how close the average use is to the Minimum and Maximum values. This comparison helps you to know when to increase or decrease your resources. SampleCount - The count, or number, of data points used for the statistical calculation.'
        unit:
          allOf:
          - $ref: '#/components/schemas/MetricUnit'
          description: The unit for the metric data request. Valid units depend on the metric data being requested. For the valid units with each available metric, see the metricName parameter.
      required:
      - bucketName
      - metricName
      - startTime
      - endTime
      - period
      - statistics
      - unit
    BucketCorsAllowedHeaders:
      type: array
      items:
        $ref: '#/components/schemas/string'
    ResourceLocation:
      type: object
      properties:
        availabilityZone:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The Availability Zone. Follows the format us-east-2a (case-sensitive).
        regionName:
          allOf:
          - $ref: '#/components/schemas/RegionName'
          description: The Amazon Web Services Region name.
      description: Describes the resource location.
    StatusType:
      type: string
      enum:
      - Active
      - Inactive
    MetricPeriod:
      type: integer
      minimum: 60
      maximum: 86400
    AccountLevelBpaSync:
      type: object
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/AccountLevelBpaSyncStatus'
          description: 'The status of the account-level BPA synchronization. The following statuses are possible: InSync - Account-level BPA is synchronized. The Amazon S3 account-level BPA configuration applies to your Lightsail buckets. NeverSynced - Synchronization has not yet happened. The Amazon S3 account-level BPA configuration does not apply to your Lightsail buckets. Failed - Synchronization failed. The Amazon S3 account-level BPA configuration does not apply to your Lightsail buckets. Defaulted - Synchronization failed and account-level BPA for your Lightsail buckets is defaulted to active . You might need to complete further actions if the status is Failed or Defaulted . The message parameter provides more information for those statuses.'
        lastSyncedAt:
          allOf:
          - $ref: '#/components/schemas/IsoDate'
          description: The timestamp of when the account-level BPA configuration was last synchronized. This value is null when the account-level BPA configuration has not been synchronized.
        message:
          allOf:
          - $ref: '#/components/schemas/BPAStatusMessage'
          description: 'A message that provides a reason for a Failed or Defaulted synchronization status. The following messages are possible: SYNC_ON_HOLD - The synchronization has not yet happened. This status message occurs immediately after you create your first Lightsail bucket. This status message should change after the first synchronization happens, approximately 1 hour after the first bucket is created. DEFAULTED_FOR_SLR_MISSING - The synchronization failed because the required service-linked role is missing from your Amazon Web Services account. The account-level BPA configuration for your Lightsail buckets is defaulted to active until the synchronization can occur. This means that all your buckets are private and not publicly accessible. For more information about how to create the required service-linked role to allow synchronization, see Using Service-Linked Roles for Amazon Lightsail in the Amazon Lightsail Developer Guide . DEFAULTED_FOR_SLR_MISSING_ON_HOLD - The synchronization failed because the required service-linked role is missing from your Amazon Web Services account. Account-level BPA is not yet configured for your Lightsail buckets. Therefore, only the bucket access permissions and individual object access permissions apply to your Lightsail buckets. For more information about how to create the required service-linked role to allow synchronization, see Using Service-Linked Roles for Amazon Lightsail in the Amazon Lightsail Developer Guide . Unknown - The reason that synchronization failed is unknown. Contact Amazon Web Services Support for more information.'
        bpaImpactsLightsail:
          allOf:
          - $ref: '#/components/schemas/boolean'
          description: A Boolean value that indicates whether account-level block public access is affecting your Lightsail buckets.
      description: Describes the synchronization status of the Amazon Simple Storage Service (Amazon S3) account-level block public access (BPA) feature for your Lightsail buckets. The account-level BPA feature of Amazon S3 provides centralized controls to limit public access to all Amazon S3 buckets in an account. BPA can make all Amazon S3 buckets in an Amazon Web Services account private regardless of the individual bucket and object permissions that are configured. Lightsail buckets take into account the Amazon S3 account-level BPA configuration when allowing or denying public access. To do this, Lightsail periodically fetches the account-level BPA configuration from Amazon S3. When the account-level BPA status is InSync , the Amazon S3 account-level BPA configuration is synchronized and it applies to your Lightsail buckets. For more information about Amazon Simple Storage Service account-level BPA and how it affects Lightsail buckets, see Block public access for buckets in Amazon Lightsail in the Amazon Lightsail Developer Guide .
    BucketMetricName:
      type: string
      enum:
      - BucketSizeBytes
      - NumberOfObjects
    CreateBucketResult:
      type: object
      properties:
        bucket:
          allOf:
          - $ref: '#/components/schemas/Bucket'
          description: An object that describes the bucket that is created.
        operations:
          allOf:
          - $ref: '#/components/schemas/OperationList'
          description: An array of objects that describe the result of the action, such as the status of the request, the timestamp of the request, and the resources affected by the request.
    OperationStatus:
      type: string
      enum:
      - NotStarted
      - Started
      - Failed
      - Completed
      - Succeeded
    AccessRules:
      type: object
      properties:
        getObject:
          allOf:
          - $ref: '#/components/schemas/AccessType'
          description: 'Specifies the anonymous access to all objects in a bucket. The following options can be specified: public - Sets all objects in the bucket to public (read-only), making them readable by anyone in the world. If the getObject value is set to public , then all objects in the bucket default to public regardless of the allowPublicOverrides value. private - Sets all objects in the bucket to private, making them readable only by you or anyone you give access to. If the getObject value is set to private , and the allowPublicOverrides value is set to true , then all objects in the bucket default to private unless they are configured with a public-read ACL. Individual objects with a public-read ACL are readable by anyone in the world.'
        allowPublicOverrides:
          allOf:
          - $ref: '#/components/schemas/boolean'
          description: A Boolean value that indicates whether the access control list (ACL) permissions that are applied to individual objects override the getObject option that is currently specified. When this is true, you can use the PutObjectAcl Amazon S3 API action to set individual objects to public (read-only) using the public-read ACL, or to private using the private ACL.
      description: Describes the anonymous access permissions for an Amazon Lightsail bucket and its objects. For more information about bucket access permissions, see Understanding bucket permissions in Amazon Lightsail in the Amazon Lightsail Developer Guide .
    AccessDeniedException:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/string'
        docs:
          $ref: '#/components/schemas/string'
        message:
          $ref: '#/components/schemas/string'
        tip:
          $ref: '#/components/schemas/string'
      description: Lightsail throws this exception when the user cannot be authenticated or uses invalid credentials to access a resource.
    TagList:
      type: array
      items:
        $ref: '#/components/schemas/Tag'
    NotFoundException:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/string'
        docs:
          $ref: '#/components/schemas/string'
        message:
          $ref: '#/components/schemas/string'
        tip:
          $ref: '#/components/schemas/string'
      description: Lightsail throws this exception when it cannot find a resource.
    GetBucketsResult:
      type: object
      properties:
        buckets:
          allOf:
          - $ref: '#/components/schemas/BucketList'
          description: An array of objects that describe buckets.
        nextPageToken:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The token to advance to the next page of results from your request. A next page token is not returned if there are no more results to display. To get the next page of results, perform another GetBuckets request and specify the next page token using the pageToken parameter.
        accountLevelBpaSync:
          allOf:
          - $ref: '#/components/schemas/AccountLevelBpaSync'
          description: An object that describes the synchronization status of the Amazon S3 account-level block public access feature for your Lightsail buckets. For more information about this feature and how it affects Lightsail buckets, see Block public access for buckets in Amazon Lightsail .
  securitySchemes:
    sigv4:
      type: apiKey
      name: Authorization
      in: header
      description: AWS Signature Version 4. Sign each request with IAM credentials for service name "lightsail"; the Authorization header carries the AWS4-HMAC-SHA256 credential scope, signed headers and signature. Temporary STS credentials additionally require X-Amz-Security-Token. See https://docs.aws.amazon.com/lightsail/2016-11-28/api-reference/CommonParameters.html
externalDocs:
  description: Amazon Lightsail API Reference
  url: https://docs.aws.amazon.com/lightsail/2016-11-28/api-reference/Welcome.html
