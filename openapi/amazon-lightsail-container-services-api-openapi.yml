        tags:
          allOf:
          - $ref: '#/components/schemas/TagList'
          description: The tag keys and optional values for the resource. For more information about tags in Lightsail, see the Amazon Lightsail Developer Guide .
        power:
          allOf:
          - $ref: '#/components/schemas/ContainerServicePowerName'
          description: The power specification of the container service. The power specifies the amount of RAM, the number of vCPUs, and the base price of the container service.
        powerId:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The ID of the power of the container service.
        state:
          allOf:
          - $ref: '#/components/schemas/ContainerServiceState'
          description: 'The current state of the container service. The following container service states are possible: PENDING - The container service is being created. READY - The container service is running but it does not have an active container deployment. DEPLOYING - The container service is launching a container deployment. RUNNING - The container service is running and it has an active container deployment. UPDATING - The container service capacity or its custom domains are being updated. DELETING - The container service is being deleted. DISABLED - The container service is disabled, and its active deployment and containers, if any, are shut down.'
        stateDetail:
          allOf:
          - $ref: '#/components/schemas/ContainerServiceStateDetail'
          description: An object that describes the current state of the container service. The state detail is populated only when a container service is in a PENDING , DEPLOYING , or UPDATING state.
        scale:
          allOf:
          - $ref: '#/components/schemas/ContainerServiceScale'
          description: The scale specification of the container service. The scale specifies the allocated compute nodes of the container service.
        currentDeployment:
          allOf:
          - $ref: '#/components/schemas/ContainerServiceDeployment'
          description: An object that describes the current container deployment of the container service.
        nextDeployment:
          allOf:
          - $ref: '#/components/schemas/ContainerServiceDeployment'
          description: An object that describes the next deployment of the container service. This value is null when there is no deployment in a pending state.
        isDisabled:
          allOf:
          - $ref: '#/components/schemas/boolean'
          description: A Boolean value indicating whether the container service is disabled.
        principalArn:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The principal ARN of the container service. The principal ARN can be used to create a trust relationship between your standard Amazon Web Services account and your Lightsail container service. This allows you to give your service permission to access resources in your standard Amazon Web Services account.
        privateDomainName:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The private domain name of the container service. The private domain name is accessible only by other resources within the default virtual private cloud (VPC) of your Lightsail account.
        publicDomainNames:
          allOf:
          - $ref: '#/components/schemas/ContainerServicePublicDomains'
          description: The public domain name of the container service, such as example.com and www.example.com . You can specify up to four public domain names for a container service. The domain names that you specify are used when you create a deployment with a container configured as the public endpoint of your container service. If you don't specify public domain names, then you can use the default domain of the container service. You must create and validate an SSL/TLS certificate before you can use public domain names with your container service. Use the CreateCertificate action to create a certificate for the public domain names you want to use with your container service. See CreateContainerService or UpdateContainerService for information about how to specify public domain names for your Lightsail container service.
        url:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The publicly accessible URL of the container service. If no public endpoint is specified in the currentDeployment , this URL returns a 404 response.
        privateRegistryAccess:
          allOf:
          - $ref: '#/components/schemas/PrivateRegistryAccess'
          description: An object that describes the configuration for the container service to access private container image repositories, such as Amazon Elastic Container Registry (Amazon ECR) private repositories. For more information, see Configuring access to an Amazon ECR private repository for an Amazon Lightsail container service in the Amazon Lightsail Developer Guide .
      description: Describes an Amazon Lightsail container service.
    TagKey:
      type: string
    GetContainerLogResult:
      type: object
      properties:
        logEvents:
          allOf:
          - $ref: '#/components/schemas/ContainerServiceLogEventList'
          description: An array of objects that describe the log events of a container.
        nextPageToken:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The token to advance to the next page of results from your request. A next page token is not returned if there are no more results to display. To get the next page of results, perform another GetContainerLog request and specify the next page token using the pageToken parameter.
    Environment:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/string'
    string:
      type: string
    ContainerServiceList:
      type: array
      items:
        $ref: '#/components/schemas/ContainerService'
    CreateContainerServiceResult:
      type: object
      properties:
        containerService:
          allOf:
          - $ref: '#/components/schemas/ContainerService'
          description: An object that describes a container service.
    float:
      type: number
    ContainerServicePowerName:
      type: string
      enum:
      - nano
      - micro
      - small
      - medium
      - large
      - xlarge
    PortMap:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/ContainerServiceProtocol'
    ContainerServiceDeployment:
      type: object
      properties:
        version:
          allOf:
          - $ref: '#/components/schemas/integer'
          description: The version number of the deployment.
        state:
          allOf:
          - $ref: '#/components/schemas/ContainerServiceDeploymentState'
          description: 'The state of the deployment. A deployment can be in one of the following states: ACTIVATING - The deployment is being created. ACTIVE - The deployment was successfully created, and it''s currently running on the container service. The container service can have only one deployment in an active state at a time. INACTIVE - The deployment was previously successfully created, but it is not currently running on the container service. FAILED - The deployment failed. Use the GetContainerLog action to view the log events for the containers in the deployment to try to determine the reason for the failure.'
        containers:
          allOf:
          - $ref: '#/components/schemas/ContainerMap'
          description: An object that describes the configuration for the containers of the deployment.
        publicEndpoint:
          allOf:
          - $ref: '#/components/schemas/ContainerServiceEndpoint'
          description: An object that describes the endpoint of the deployment.
        createdAt:
          allOf:
          - $ref: '#/components/schemas/IsoDate'
          description: The timestamp when the deployment was created.
      description: Describes a container deployment configuration of an Amazon Lightsail container service. A deployment specifies the settings, such as the ports and launch command, of containers that are deployed to your container service.
    ContainerServiceEndpoint:
      type: object
      properties:
        containerName:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The name of the container entry of the deployment that the endpoint configuration applies to.
        containerPort:
          allOf:
          - $ref: '#/components/schemas/integer'
          description: The port of the specified container to which traffic is forwarded to.
        healthCheck:
          allOf:
          - $ref: '#/components/schemas/ContainerServiceHealthCheckConfig'
          description: An object that describes the health check configuration of the container.
      description: Describes the public endpoint configuration of a deployment of an Amazon Lightsail container service.
    ResourceLocation:
      type: object
      properties:
        availabilityZone:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The Availability Zone. Follows the format us-east-2a (case-sensitive).
        regionName:
          allOf:
          - $ref: '#/components/schemas/RegionName'
          description: The Amazon Web Services Region name.
      description: Describes the resource location.
    RegisterContainerImageResult:
      type: object
      properties:
        containerImage:
          allOf:
          - $ref: '#/components/schemas/ContainerImage'
          description: An object that describes a container image that is registered to a Lightsail container service
    MetricPeriod:
      type: integer
      minimum: 60
      maximum: 86400
    ContainerServicesListResult:
      type: object
      properties:
        containerServices:
          allOf:
          - $ref: '#/components/schemas/ContainerServiceList'
          description: An array of objects that describe one or more container services.
    CreateContainerServiceRequest:
      type: object
      properties:
        serviceName:
          allOf:
          - $ref: '#/components/schemas/ContainerServiceName'
          description: 'The name for the container service. The name that you specify for your container service will make up part of its default domain. The default domain of a container service is typically https:// . . .cs.amazonlightsail.com . If the name of your container service is container-service-1 , and it''s located in the US East (Ohio) Amazon Web Services Region ( us-east-2 ), then the domain for your container service will be like the following example: https://container-service-1.ur4EXAMPLE2uq.us-east-2.cs.amazonlightsail.com The following are the requirements for container service names: Must be unique within each Amazon Web Services Region in your Lightsail account. Must contain 1 to 63 characters. Must contain only alphanumeric characters and hyphens. A hyphen (-) can separate words but cannot be at the start or end of the name.'
        power:
          allOf:
          - $ref: '#/components/schemas/ContainerServicePowerName'
          description: The power specification for the container service. The power specifies the amount of memory, vCPUs, and base monthly cost of each node of the container service. The power and scale of a container service makes up its configured capacity. To determine the monthly price of your container service, multiply the base price of the power with the scale (the number of nodes) of the service. Use the GetContainerServicePowers action to get a list of power options that you can specify using this parameter, and their base monthly cost.
        scale:
          allOf:
          - $ref: '#/components/schemas/ContainerServiceScale'
          description: The scale specification for the container service. The scale specifies the allocated compute nodes of the container service. The power and scale of a container service makes up its configured capacity. To determine the monthly price of your container service, multiply the base price of the power with the scale (the number of nodes) of the service.
        tags:
          allOf:
          - $ref: '#/components/schemas/TagList'
          description: The tag keys and optional values to add to the container service during create. Use the TagResource action to tag a resource after it's created. For more information about tags in Lightsail, see the Amazon Lightsail Developer Guide .
        publicDomainNames:
          allOf:
          - $ref: '#/components/schemas/ContainerServicePublicDomains'
          description: The public domain names to use with the container service, such as example.com and www.example.com . You can specify up to four public domain names for a container service. The domain names that you specify are used when you create a deployment with a container configured as the public endpoint of your container service. If you don't specify public domain names, then you can use the default domain of the container service. You must create and validate an SSL/TLS certificate before you can use public domain names with your container service. Use the CreateCertificate action to create a certificate for the public domain names you want to use with your container service. You can specify public domain names using a string to array map as shown in the example later on this page.
        deployment:
          allOf:
          - $ref: '#/components/schemas/ContainerServiceDeploymentRequest'
          description: An object that describes a deployment for the container service. A deployment specifies the containers that will be launched on the container service and their settings, such as the ports to open, the environment variables to apply, and the launch command to run. It also specifies the container that will serve as the public endpoint of the deployment and its settings, such as the HTTP or HTTPS port to use, and the health check configuration.
        privateRegistryAccess:
          allOf:
          - $ref: '#/components/schemas/PrivateRegistryAccessRequest'
          description: An object to describe the configuration for the container service to access private container image repositories, such as Amazon Elastic Container Registry (Amazon ECR) private repositories. For more information, see Configuring access to an Amazon ECR private repository for an Amazon Lightsail container service in the Amazon Lightsail Developer Guide .
      required:
      - serviceName
      - power
      - scale
    ContainerServicePower:
      type: object
      properties:
        powerId:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The ID of the power ( nano-1 ).
        price:
          allOf:
          - $ref: '#/components/schemas/float'
          description: The monthly price of the power in USD.
        cpuCount:
          allOf:
          - $ref: '#/components/schemas/float'
          description: The number of vCPUs included in the power.
        ramSizeInGb:
          allOf:
          - $ref: '#/components/schemas/float'
          description: The amount of RAM (in GB) of the power.
        name:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The friendly name of the power ( nano ).
        isActive:
          allOf:
          - $ref: '#/components/schemas/boolean'
          description: A Boolean value indicating whether the power is active and can be specified for container services.
      description: Describes the powers that can be specified for an Amazon Lightsail container service. The power specifies the amount of RAM, the number of vCPUs, and the base price of the container service.
    Container:
      type: object
      properties:
        image:
          allOf:
          - $ref: '#/components/schemas/string'
          description: 'The name of the image used for the container. Container images sourced from your Lightsail container service, that are registered and stored on your service, start with a colon ( : ). For example, if your container service name is container-service-1 , the container image label is mystaticsite , and you want to use the third ( 3 ) version of the registered container image, then you should specify :container-service-1.mystaticsite.3 . To use the latest version of a container image, specify latest instead of a version number (for example, :container-service-1.mystaticsite.latest ). Lightsail will automatically use the highest numbered version of the registered container image. Container images sourced from a public registry like Docker Hub don''t start with a colon. For example, nginx:latest or nginx .'
        command:
          allOf:
          - $ref: '#/components/schemas/StringList'
          description: The launch command for the container.
        environment:
          allOf:
          - $ref: '#/components/schemas/Environment'
          description: The environment variables of the container.
        ports:
          allOf:
          - $ref: '#/components/schemas/PortMap'
          description: The open firewall ports of the container.
      description: Describes the settings of a container that will be launched, or that is launched, to an Amazon Lightsail container service.
    CreateContainerServiceDeploymentResult:
      type: object
      properties:
        containerService:
          allOf:
          - $ref: '#/components/schemas/ContainerService'
          description: An object that describes a container service.
    AccessDeniedException:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/string'
        docs:
          $ref: '#/components/schemas/string'
        message:
          $ref: '#/components/schemas/string'
        tip:
          $ref: '#/components/schemas/string'
      description: Lightsail throws this exception when the user cannot be authenticated or uses invalid credentials to access a resource.
    TagList:
      type: array
      items:
        $ref: '#/components/schemas/Tag'
    NotFoundException:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/string'
        docs:
          $ref: '#/components/schemas/string'
        message:
          $ref: '#/components/schemas/string'
        tip:
          $ref: '#/components/schemas/string'
      description: Lightsail throws this exception when it cannot find a resource.
    CreateContainerServiceRegistryLoginResult:
      type: object
      properties:
        registryLogin:
          allOf:
          - $ref: '#/components/schemas/ContainerServiceRegistryLogin'
          description: An object that describes the log in information for the container service registry of your Lightsail account.
  securitySchemes:
    sigv4:
      type: apiKey
      name: Authorization
      in: header
      description: AWS Signature Version 4. Sign each request with IAM credentials for service name "lightsail"; the Authorization header carries the AWS4-HMAC-SHA256 credential scope, signed headers and signature. Temporary STS credentials additionally require X-Amz-Security-Token. See https://docs.aws.amazon.com/lightsail/2016-11-28/api-reference/CommonParameters.html
externalDocs:
  description: Amazon Lightsail API Reference
  url: https://docs.aws.amazon.com/lightsail/2016-11-28/api-reference/Welcome.html
