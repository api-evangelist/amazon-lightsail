          description: 'The status of the partner membership. The following statuses are possible: Active – The membership is active, and the benefits of the current tier are available to the account. Suspended – The membership is suspended, and the benefits of the tier are not available to the account.'
      required:
      - enrolledAt
      - status
      description: An object that contains information about the Lightsail partner program membership of an Amazon Lightsail account.
    AccountSetupInProgressException:
      type: object
