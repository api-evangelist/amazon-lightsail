        metricName:
          allOf:
          - $ref: '#/components/schemas/BucketMetricName'
          description: 'The metric for which you want to return information. Valid bucket metric names are listed
            below, along with the most useful statistics to include in your request, and the published unit value.
            These bucket metrics are reported once per day. BucketSizeBytes - The amount of data in bytes stored
