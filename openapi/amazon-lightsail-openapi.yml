            database is used for failover support of a high availability database.
        backupRetentionEnabled:
          allOf:
          - $ref: '#/components/schemas/boolean'
          description: A Boolean value indicating whether automated backup retention is enabled for the database.
        pendingModifiedValues:
          allOf:
          - $ref: '#/components/schemas/PendingModifiedRelationalDatabaseValues'
          description: Describes pending database value modifications.
        engine:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The database software (for example, MySQL ).
        engineVersion:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The database engine version (for example, 5.7.23 ).
        latestRestorableTime:
          allOf:
          - $ref: '#/components/schemas/IsoDate'
          description: The latest point in time to which the database can be restored. Formatted in Unix time.
        masterUsername:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The master user name of the database.
        parameterApplyStatus:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The status of parameter updates for the database.
        preferredBackupWindow:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The daily time range during which automated backups are created for the database (for example,
            16:00-16:30 ).
        preferredMaintenanceWindow:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The weekly time range during which system maintenance can occur on the database. In the format
            ddd:hh24:mi-ddd:hh24:mi . For example, Tue:17:00-Tue:17:30 .
        publiclyAccessible:
          allOf:
          - $ref: '#/components/schemas/boolean'
          description: A Boolean value indicating whether the database is publicly accessible.
