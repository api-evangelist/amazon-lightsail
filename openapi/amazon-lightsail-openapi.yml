          description: An object that describes the activation status of the role that you can use to grant a Lightsail
            container service access to Amazon ECR private repositories. If the role is activated, the Amazon Resource
            Name (ARN) of the role is also listed.
      description: Describes the configuration for an Amazon Lightsail container service to access private container
        image repositories, such as Amazon Elastic Container Registry (Amazon ECR) private repositories. For more
