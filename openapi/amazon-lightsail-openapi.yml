            a virtual private server (or instance ) image used to create instances quickly.
        fromBundleId:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The bundle ID from which you created the snapshot ( micro_x_x ).
        isFromAutoSnapshot:
          allOf:
          - $ref: '#/components/schemas/boolean'
          description: A Boolean value indicating whether the snapshot was created from an automatic snapshot.
        sizeInGb:
