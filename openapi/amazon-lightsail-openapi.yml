            depending on what you specify for the attributeName request parameter: If you specify HealthCheckPath
            for the attributeName request parameter, then the attributeValue request parameter must be the path
            to ping on the target (for example, /weather/us/wa/seattle ). If you specify SessionStickinessEnabled
