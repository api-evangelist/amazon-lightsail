components:
  securitySchemes:
    sigv4:
      type: apiKey
      name: Authorization
      in: header
      description: AWS Signature Version 4. Sign each request with IAM credentials for service name "lightsail";
        the Authorization header carries the AWS4-HMAC-SHA256 credential scope, signed headers and signature. Temporary
        STS credentials additionally require X-Amz-Security-Token. See https://docs.aws.amazon.com/lightsail/2016-11-28/api-reference/CommonParameters.html
  schemas:
    AccessDeniedException:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/string'
        docs:
          $ref: '#/components/schemas/string'
        message:
          $ref: '#/components/schemas/string'
        tip:
          $ref: '#/components/schemas/string'
      description: Lightsail throws this exception when the user cannot be authenticated or uses invalid credentials
        to access a resource.
    AccessDirection:
      type: string
      enum:
      - inbound
      - outbound
    AccessKey:
      type: object
      properties:
        accessKeyId:
          allOf:
          - $ref: '#/components/schemas/IAMAccessKeyId'
          description: The ID of the access key.
        secretAccessKey:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The secret access key used to sign requests. You should store the secret access key in a
            safe location. We recommend that you delete the access key if the secret access key is compromised.
        status:
          allOf:
          - $ref: '#/components/schemas/StatusType'
          description: The status of the access key. A status of Active means that the key is valid, while Inactive
            means it is not.
        createdAt:
          allOf:
          - $ref: '#/components/schemas/IsoDate'
          description: The timestamp when the access key was created.
        lastUsed:
          allOf:
          - $ref: '#/components/schemas/AccessKeyLastUsed'
          description: An object that describes the last time the access key was used. This object does not include
            data in the response of a CreateBucketAccessKey action. If the access key has not been used, the region
            and serviceName values are N/A , and the lastUsedDate value is null.
      description: Describes an access key for an Amazon Lightsail bucket. Access keys grant full programmatic access
        to the specified bucket and its objects. You can have a maximum of two access keys per bucket. Use the CreateBucketAccessKey
        action to create an access key for a specific bucket. For more information about access keys, see Creating
        access keys for a bucket in Amazon Lightsail in the Amazon Lightsail Developer Guide . The secretAccessKey
        value is returned only in response to the CreateBucketAccessKey action. You can get a secret access key
        only when you first create an access key; you cannot get the secret access key later. If you lose the secret
        access key, you must create a new access key.
    AccessKeyLastUsed:
      type: object
      properties:
        lastUsedDate:
          allOf:
          - $ref: '#/components/schemas/IsoDate'
          description: The date and time when the access key was most recently used. This value is null if the access
            key has not been used.
        region:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The Amazon Web Services Region where this access key was most recently used. This value is
            N/A if the access key has not been used.
        serviceName:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The name of the Amazon Web Services service with which this access key was most recently
            used. This value is N/A if the access key has not been used.
      description: Describes the last time an access key was used. This object does not include data in the response
        of a CreateBucketAccessKey action.
    AccessKeyList:
      type: array
      items:
        $ref: '#/components/schemas/AccessKey'
    AccessReceiverList:
      type: array
      items:
        $ref: '#/components/schemas/ResourceReceivingAccess'
    AccessRules:
      type: object
      properties:
        getObject:
          allOf:
          - $ref: '#/components/schemas/AccessType'
          description: 'Specifies the anonymous access to all objects in a bucket. The following options can be
            specified: public - Sets all objects in the bucket to public (read-only), making them readable by anyone
            in the world. If the getObject value is set to public , then all objects in the bucket default to public
            regardless of the allowPublicOverrides value. private - Sets all objects in the bucket to private, making
            them readable only by you or anyone you give access to. If the getObject value is set to private , and
            the allowPublicOverrides value is set to true , then all objects in the bucket default to private unless
            they are configured with a public-read ACL. Individual objects with a public-read ACL are readable by
            anyone in the world.'
        allowPublicOverrides:
          allOf:
          - $ref: '#/components/schemas/boolean'
          description: A Boolean value that indicates whether the access control list (ACL) permissions that are
            applied to individual objects override the getObject option that is currently specified. When this is
            true, you can use the PutObjectAcl Amazon S3 API action to set individual objects to public (read-only)
            using the public-read ACL, or to private using the private ACL.
      description: Describes the anonymous access permissions for an Amazon Lightsail bucket and its objects. For
        more information about bucket access permissions, see Understanding bucket permissions in Amazon Lightsail
        in the Amazon Lightsail Developer Guide .
    AccessType:
      type: string
      enum:
      - public
      - private
    AccountLevelBpaSync:
      type: object
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/AccountLevelBpaSyncStatus'
          description: 'The status of the account-level BPA synchronization. The following statuses are possible:
            InSync - Account-level BPA is synchronized. The Amazon S3 account-level BPA configuration applies to
            your Lightsail buckets. NeverSynced - Synchronization has not yet happened. The Amazon S3 account-level
            BPA configuration does not apply to your Lightsail buckets. Failed - Synchronization failed. The Amazon
            S3 account-level BPA configuration does not apply to your Lightsail buckets. Defaulted - Synchronization
            failed and account-level BPA for your Lightsail buckets is defaulted to active . You might need to complete
            further actions if the status is Failed or Defaulted . The message parameter provides more information
            for those statuses.'
        lastSyncedAt:
          allOf:
          - $ref: '#/components/schemas/IsoDate'
          description: The timestamp of when the account-level BPA configuration was last synchronized. This value
            is null when the account-level BPA configuration has not been synchronized.
        message:
          allOf:
          - $ref: '#/components/schemas/BPAStatusMessage'
          description: 'A message that provides a reason for a Failed or Defaulted synchronization status. The following
            messages are possible: SYNC_ON_HOLD - The synchronization has not yet happened. This status message
            occurs immediately after you create your first Lightsail bucket. This status message should change after
            the first synchronization happens, approximately 1 hour after the first bucket is created. DEFAULTED_FOR_SLR_MISSING
            - The synchronization failed because the required service-linked role is missing from your Amazon Web
            Services account. The account-level BPA configuration for your Lightsail buckets is defaulted to active
            until the synchronization can occur. This means that all your buckets are private and not publicly accessible.
            For more information about how to create the required service-linked role to allow synchronization,
            see Using Service-Linked Roles for Amazon Lightsail in the Amazon Lightsail Developer Guide . DEFAULTED_FOR_SLR_MISSING_ON_HOLD
            - The synchronization failed because the required service-linked role is missing from your Amazon Web
            Services account. Account-level BPA is not yet configured for your Lightsail buckets. Therefore, only
            the bucket access permissions and individual object access permissions apply to your Lightsail buckets.
            For more information about how to create the required service-linked role to allow synchronization,
            see Using Service-Linked Roles for Amazon Lightsail in the Amazon Lightsail Developer Guide . Unknown
            - The reason that synchronization failed is unknown. Contact Amazon Web Services Support for more information.'
        bpaImpactsLightsail:
          allOf:
          - $ref: '#/components/schemas/boolean'
          description: A Boolean value that indicates whether account-level block public access is affecting your
            Lightsail buckets.
      description: Describes the synchronization status of the Amazon Simple Storage Service (Amazon S3) account-level
        block public access (BPA) feature for your Lightsail buckets. The account-level BPA feature of Amazon S3
        provides centralized controls to limit public access to all Amazon S3 buckets in an account. BPA can make
        all Amazon S3 buckets in an Amazon Web Services account private regardless of the individual bucket and
        object permissions that are configured. Lightsail buckets take into account the Amazon S3 account-level
        BPA configuration when allowing or denying public access. To do this, Lightsail periodically fetches the
        account-level BPA configuration from Amazon S3. When the account-level BPA status is InSync , the Amazon
        S3 account-level BPA configuration is synchronized and it applies to your Lightsail buckets. For more information
        about Amazon Simple Storage Service account-level BPA and how it affects Lightsail buckets, see Block public
        access for buckets in Amazon Lightsail in the Amazon Lightsail Developer Guide .
    AccountLevelBpaSyncStatus:
      type: string
      enum:
      - InSync
      - Failed
      - NeverSynced
      - Defaulted
    AccountSetupInProgressException:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/string'
        docs:
          $ref: '#/components/schemas/string'
        message:
          $ref: '#/components/schemas/string'
        tip:
          $ref: '#/components/schemas/string'
      description: Lightsail throws this exception when an account is still in the setup in progress state.
    AddOn:
      type: object
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The name of the add-on.
        status:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The status of the add-on.
        snapshotTimeOfDay:
          allOf:
          - $ref: '#/components/schemas/TimeOfDay'
          description: The daily time when an automatic snapshot is created. The time shown is in HH:00 format,
            and in Coordinated Universal Time (UTC). The snapshot is automatically created between the time shown
            and up to 45 minutes after.
        nextSnapshotTimeOfDay:
          allOf:
          - $ref: '#/components/schemas/TimeOfDay'
          description: The next daily time an automatic snapshot will be created. The time shown is in HH:00 format,
            and in Coordinated Universal Time (UTC). The snapshot is automatically created between the time shown
            and up to 45 minutes after.
        threshold:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The trigger threshold of the action. This add-on only applies to Lightsail for Research resources.
        duration:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The amount of idle time in minutes after which your virtual computer will automatically stop.
            This add-on only applies to Lightsail for Research resources.
      description: Describes an add-on that is enabled for an Amazon Lightsail resource.
    AddOnList:
      type: array
      items:
        $ref: '#/components/schemas/AddOn'
    AddOnRequest:
      type: object
      properties:
        addOnType:
          allOf:
          - $ref: '#/components/schemas/AddOnType'
          description: The add-on type.
        autoSnapshotAddOnRequest:
          allOf:
          - $ref: '#/components/schemas/AutoSnapshotAddOnRequest'
          description: An object that represents additional parameters when enabling or modifying the automatic
            snapshot add-on.
        stopInstanceOnIdleRequest:
          allOf:
          - $ref: '#/components/schemas/StopInstanceOnIdleRequest'
          description: An object that represents additional parameters when enabling or modifying the StopInstanceOnIdle
            add-on. This object only applies to Lightsail for Research resources.
      required:
      - addOnType
      description: Describes a request to enable, modify, or disable an add-on for an Amazon Lightsail resource.
        An additional cost may be associated with enabling add-ons. For more information, see the Lightsail pricing
        page .
    AddOnRequestList:
      type: array
      items:
        $ref: '#/components/schemas/AddOnRequest'
    AddOnType:
      type: string
      enum:
      - AutoSnapshot
      - StopInstanceOnIdle
    Alarm:
      type: object
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/ResourceName'
          description: The name of the alarm.
        arn:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The Amazon Resource Name (ARN) of the alarm.
        createdAt:
          allOf:
          - $ref: '#/components/schemas/IsoDate'
          description: The timestamp when the alarm was created.
        location:
          allOf:
          - $ref: '#/components/schemas/ResourceLocation'
          description: An object that lists information about the location of the alarm.
        resourceType:
          allOf:
          - $ref: '#/components/schemas/ResourceType'
          description: The Lightsail resource type of the alarm.
        supportCode:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The support code. Include this code in your email to support when you have questions about
            your Lightsail alarm. This code enables our support team to look up your Lightsail information more
            easily.
        monitoredResourceInfo:
          allOf:
          - $ref: '#/components/schemas/MonitoredResourceInfo'
          description: An object that lists information about the resource monitored by the alarm.
        comparisonOperator:
          allOf:
          - $ref: '#/components/schemas/ComparisonOperator'
          description: The arithmetic operation used when comparing the specified statistic and threshold.
        evaluationPeriods:
          allOf:
          - $ref: '#/components/schemas/integer'
          description: The number of periods over which data is compared to the specified threshold.
        period:
          allOf:
          - $ref: '#/components/schemas/MetricPeriod'
          description: The period, in seconds, over which the statistic is applied.
        threshold:
          allOf:
          - $ref: '#/components/schemas/double'
          description: The value against which the specified statistic is compared.
        datapointsToAlarm:
          allOf:
          - $ref: '#/components/schemas/integer'
          description: The number of data points that must not within the specified threshold to trigger the alarm.
        treatMissingData:
          allOf:
          - $ref: '#/components/schemas/TreatMissingData'
          description: 'Specifies how the alarm handles missing data points. An alarm can treat missing data in
            the following ways: breaching - Assume the missing data is not within the threshold. Missing data counts
            towards the number of times the metric is not within the threshold. notBreaching - Assume the missing
            data is within the threshold. Missing data does not count towards the number of times the metric is
            not within the threshold. ignore - Ignore the missing data. Maintains the current alarm state. missing
            - Missing data is treated as missing.'
        statistic:
          allOf:
          - $ref: '#/components/schemas/MetricStatistic'
          description: 'The statistic for the metric associated with the alarm. The following statistics are available:
            Minimum - The lowest value observed during the specified period. Use this value to determine low volumes
            of activity for your application. Maximum - The highest value observed during the specified period.
            Use this value to determine high volumes of activity for your application. Sum - All values submitted
            for the matching metric added together. You can use this statistic to determine the total volume of
            a metric. Average - The value of Sum / SampleCount during the specified period. By comparing this statistic
            with the Minimum and Maximum values, you can determine the full scope of a metric and how close the
            average use is to the Minimum and Maximum values. This comparison helps you to know when to increase
            or decrease your resources. SampleCount - The count, or number, of data points used for the statistical
            calculation.'
        metricName:
          allOf:
          - $ref: '#/components/schemas/MetricName'
          description: The name of the metric associated with the alarm.
        state:
          allOf:
          - $ref: '#/components/schemas/AlarmState'
          description: 'The current state of the alarm. An alarm has the following possible states: ALARM - The
            metric is outside of the defined threshold. INSUFFICIENT_DATA - The alarm has just started, the metric
            is not available, or not enough data is available for the metric to determine the alarm state. OK -
            The metric is within the defined threshold.'
        unit:
          allOf:
          - $ref: '#/components/schemas/MetricUnit'
          description: The unit of the metric associated with the alarm.
        contactProtocols:
          allOf:
          - $ref: '#/components/schemas/ContactProtocolsList'
          description: The contact protocols for the alarm, such as Email , SMS (text messaging), or both.
        notificationTriggers:
          allOf:
          - $ref: '#/components/schemas/NotificationTriggerList'
          description: The alarm states that trigger a notification.
        notificationEnabled:
          allOf:
          - $ref: '#/components/schemas/boolean'
          description: Indicates whether the alarm is enabled.
        tags:
          allOf:
          - $ref: '#/components/schemas/TagList'
          description: The tag keys and optional values for the resource. For more information about tags in Lightsail,
            see the Amazon Lightsail Developer Guide .
      description: Describes an alarm. An alarm is a way to monitor your Lightsail resource metrics. For more information,
        see Alarms in Amazon Lightsail .
    AlarmState:
      type: string
      enum:
      - OK
      - ALARM
      - INSUFFICIENT_DATA
    AlarmsList:
      type: array
      items:
        $ref: '#/components/schemas/Alarm'
    AllocateStaticIpRequest:
