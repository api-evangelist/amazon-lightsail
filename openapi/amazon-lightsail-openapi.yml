openapi: 3.1.0
info:
  title: Amazon Lightsail API
  description: 'Amazon Lightsail is the easiest way to get started with Amazon Web Services (AWS) for developers
    who need to build websites or web applications. The API manages instances (virtual private servers), container
    services, storage buckets, managed databases, block storage disks, static IP addresses, load balancers, CDN
    distributions, DNS zones and resource snapshots. Derived mechanically from the AWS-published Smithy 2.0 service
    model (aws/api-models-aws, models/lightsail/service/2016-11-28). The wire protocol is AWS JSON 1.1: every operation
    is a POST signed with AWS Signature Version 4 (service name "lightsail") carrying the X-Amz-Target header shown
    as x-amz-target on each operation. Paths and response codes are the smithy.api#http traits the model itself
    declares.'
  version: '2016-11-28'
  contact:
    name: AWS Support
    url: https://aws.amazon.com/premiumsupport/
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  x-logo:
    url: https://a0.awsstatic.com/libra-css/images/logos/aws_logo_smile_1200x630.png
  x-generated-from: AWS Smithy 2.0 service model (https://github.com/aws/api-models-aws) — mechanical transform,
    no hand-authored operations
externalDocs:
  description: Amazon Lightsail API Reference
  url: https://docs.aws.amazon.com/lightsail/2016-11-28/api-reference/Welcome.html
servers:
- url: https://lightsail.us-east-1.amazonaws.com
  description: Amazon Lightsail regional endpoint (us-east-1). Lightsail is regional — one endpoint per AWS Region,
    lightsail.{region}.amazonaws.com (IPv4) or lightsail.{region}.api.aws (dual-stack). See https://docs.aws.amazon.com/general/latest/gr/lightsail.html
security:
- sigv4: []
