        versions of the specified content based on the query string values in viewer requests.
    R53HostedZoneDeletionState:
      type: object
      properties:
        code:
          allOf:
          - $ref: '#/components/schemas/R53HostedZoneDeletionStateCode'
          description: 'The status code for the deletion state. Following are the possible values: SUCCEEDED - The
            hosted zone was successfully deleted. PENDING - The hosted zone deletion is in progress. FAILED - The
            hosted zone deletion failed. STARTED - The hosted zone deletion started.'
