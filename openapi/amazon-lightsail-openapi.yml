    AttachLoadBalancerTlsCertificateResult:
      type: object
      properties:
        operations:
          allOf:
          - $ref: '#/components/schemas/OperationList'
          description: An array of objects that describe the result of the action, such as the status of the request,
            the timestamp of the request, and the resources affected by the request. These SSL/TLS certificates
            are only usable by Lightsail load balancers. You can't get the certificate and use it for another purpose.
    AttachStaticIpRequest:
      type: object
      properties:
        staticIpName:
          allOf:
          - $ref: '#/components/schemas/ResourceName'
          description: The name of the static IP.
        instanceName:
          allOf:
          - $ref: '#/components/schemas/ResourceName'
          description: The instance name to which you want to attach the static IP address.
      required:
      - staticIpName
      - instanceName
    AttachStaticIpResult:
      type: object
      properties:
        operations:
          allOf:
          - $ref: '#/components/schemas/OperationList'
          description: An array of objects that describe the result of the action, such as the status of the request,
            the timestamp of the request, and the resources affected by the request.
    AttachedDisk:
      type: object
      properties:
        path:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The path of the disk ( /dev/xvdf ).
        sizeInGb:
          allOf:
          - $ref: '#/components/schemas/integer'
          description: The size of the disk in GB.
      description: Describes a block storage disk that is attached to an instance, and is included in an automatic
        snapshot.
    AttachedDiskList:
      type: array
      items:
        $ref: '#/components/schemas/AttachedDisk'
    AttachedDiskMap:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/DiskMapList'
    AutoMountStatus:
      type: string
      enum:
      - Failed
      - Pending
      - Mounted
      - NotMounted
    AutoSnapshotAddOnRequest:
      type: object
      properties:
        snapshotTimeOfDay:
          allOf:
          - $ref: '#/components/schemas/TimeOfDay'
          description: 'The daily time when an automatic snapshot will be created. Constraints: Must be in HH:00
            format, and in an hourly increment. Specified in Coordinated Universal Time (UTC). The snapshot will
            be automatically created between the time specified and up to 45 minutes after.'
      description: 'Describes a request to enable or modify the automatic snapshot add-on for an Amazon Lightsail
        instance or disk. When you modify the automatic snapshot time for a resource, it is typically effective
        immediately except under the following conditions: If an automatic snapshot has been created for the current
        day, and you change the snapshot time to a later time of day, then the new snapshot time will be effective
        the following day. This ensures that two snapshots are not created for the current day. If an automatic
        snapshot has not yet been created for the current day, and you change the snapshot time to an earlier time
        of day, then the new snapshot time will be effective the following day and a snapshot is automatically created
        at the previously set time for the current day. This ensures that a snapshot is created for the current
        day. If an automatic snapshot has not yet been created for the current day, and you change the snapshot
        time to a time that is within 30 minutes from your current time, then the new snapshot time will be effective
        the following day and a snapshot is automatically created at the previously set time for the current day.
        This ensures that a snapshot is created for the current day, because 30 minutes is required between your
        current time and the new snapshot time that you specify. If an automatic snapshot is scheduled to be created
        within 30 minutes from your current time and you change the snapshot time, then the new snapshot time will
        be effective the following day and a snapshot is automatically created at the previously set time for the
        current day. This ensures that a snapshot is created for the current day, because 30 minutes is required
        between your current time and the new snapshot time that you specify.'
    AutoSnapshotDate:
      type: string
      pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
    AutoSnapshotDetails:
      type: object
      properties:
        date:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The date of the automatic snapshot in YYYY-MM-DD format.
        createdAt:
          allOf:
          - $ref: '#/components/schemas/IsoDate'
          description: The timestamp when the automatic snapshot was created.
        status:
          allOf:
          - $ref: '#/components/schemas/AutoSnapshotStatus'
          description: The status of the automatic snapshot.
        fromAttachedDisks:
          allOf:
          - $ref: '#/components/schemas/AttachedDiskList'
          description: An array of objects that describe the block storage disks attached to the instance when the
            automatic snapshot was created.
      description: Describes an automatic snapshot.
    AutoSnapshotDetailsList:
      type: array
      items:
        $ref: '#/components/schemas/AutoSnapshotDetails'
    AutoSnapshotStatus:
      type: string
      enum:
      - Success
      - Failed
      - InProgress
      - NotFound
    AvailabilityZone:
      type: object
      properties:
        zoneName:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The name of the Availability Zone. The format is us-east-2a (case-sensitive).
        state:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The state of the Availability Zone.
      description: Describes an Availability Zone. This is returned only as part of a GetRegions request.
    AvailabilityZoneList:
      type: array
      items:
        $ref: '#/components/schemas/AvailabilityZone'
    BPAStatusMessage:
      type: string
      enum:
      - DEFAULTED_FOR_SLR_MISSING
      - SYNC_ON_HOLD
      - DEFAULTED_FOR_SLR_MISSING_ON_HOLD
      - Unknown
    Base64:
      type: string
    BehaviorEnum:
      type: string
      enum:
      - dont-cache
      - cache
    Blueprint:
      type: object
      properties:
        blueprintId:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The ID for the virtual private server image ( app_wordpress_x_x or app_lamp_x_x ).
        name:
          allOf:
          - $ref: '#/components/schemas/ResourceName'
          description: The friendly name of the blueprint ( Amazon Linux ).
        group:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The group name of the blueprint ( amazon-linux ).
        type:
          allOf:
          - $ref: '#/components/schemas/BlueprintType'
          description: The type of the blueprint ( os or app ).
        description:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The description of the blueprint.
        isActive:
          allOf:
          - $ref: '#/components/schemas/boolean'
          description: A Boolean value indicating whether the blueprint is active. Inactive blueprints are listed
            to support customers with existing instances but are not necessarily available for launch of new instances.
            Blueprints are marked inactive when they become outdated due to operating system updates or new application
            releases.
        minPower:
          allOf:
          - $ref: '#/components/schemas/integer'
          description: The minimum bundle power required to run this blueprint. For example, you need a bundle with
            a power value of 500 or more to create an instance that uses a blueprint with a minimum power value
            of 500. 0 indicates that the blueprint runs on all instance sizes.
        version:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The version number of the operating system, application, or stack ( 2016.03.0 ).
        versionCode:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The version code.
        productUrl:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The product URL to learn more about the image or blueprint.
        licenseUrl:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The end-user license agreement URL for the image or blueprint.
        platform:
          allOf:
          - $ref: '#/components/schemas/InstancePlatform'
          description: The operating system platform (either Linux/Unix-based or Windows Server-based) of the blueprint.
        appCategory:
          allOf:
          - $ref: '#/components/schemas/AppCategory'
          description: Virtual computer blueprints that are supported by Lightsail for Research. This parameter
            only applies to Lightsail for Research resources.
      description: Describes a blueprint (a virtual private server image).
    BlueprintList:
      type: array
      items:
        $ref: '#/components/schemas/Blueprint'
    BlueprintType:
      type: string
      enum:
      - os
      - app
    Bucket:
      type: object
      properties:
        resourceType:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The Lightsail resource type of the bucket.
        accessRules:
          allOf:
          - $ref: '#/components/schemas/AccessRules'
          description: An object that describes the access rules of the bucket.
        arn:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The Amazon Resource Name (ARN) of the bucket.
        bundleId:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The ID of the bundle currently applied to the bucket. A bucket bundle specifies the monthly
            cost, storage space, and data transfer quota for a bucket. Use the UpdateBucketBundle action to change
            the bundle of a bucket.
        createdAt:
          allOf:
          - $ref: '#/components/schemas/IsoDate'
          description: The timestamp when the distribution was created.
        url:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The URL of the bucket.
        location:
          allOf:
          - $ref: '#/components/schemas/ResourceLocation'
          description: An object that describes the location of the bucket, such as the Amazon Web Services Region
            and Availability Zone.
        name:
          allOf:
          - $ref: '#/components/schemas/BucketName'
          description: The name of the bucket.
        supportCode:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The support code for a bucket. Include this code in your email to support when you have questions
            about a Lightsail bucket. This code enables our support team to look up your Lightsail information more
            easily.
        tags:
          allOf:
          - $ref: '#/components/schemas/TagList'
          description: The tag keys and optional values for the bucket. For more information, see Tags in Amazon
            Lightsail in the Amazon Lightsail Developer Guide .
        objectVersioning:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: 'Indicates whether object versioning is enabled for the bucket. The following options can
            be configured: Enabled - Object versioning is enabled. Suspended - Object versioning was previously
            enabled but is currently suspended. Existing object versions are retained. NeverEnabled - Object versioning
            has never been enabled.'
        ableToUpdateBundle:
          allOf:
          - $ref: '#/components/schemas/boolean'
          description: Indicates whether the bundle that is currently applied to a bucket can be changed to another
            bundle. You can update a bucket's bundle only one time within a monthly Amazon Web Services billing
            cycle. Use the UpdateBucketBundle action to change a bucket's bundle.
        readonlyAccessAccounts:
          allOf:
          - $ref: '#/components/schemas/PartnerIdList'
          description: An array of strings that specify the Amazon Web Services account IDs that have read-only
            access to the bucket.
        resourcesReceivingAccess:
          allOf:
          - $ref: '#/components/schemas/AccessReceiverList'
          description: An array of objects that describe Lightsail instances that have access to the bucket. Use
            the SetResourceAccessForBucket action to update the instances that have access to a bucket.
        state:
          allOf:
          - $ref: '#/components/schemas/BucketState'
          description: An object that describes the state of the bucket.
        accessLogConfig:
          allOf:
          - $ref: '#/components/schemas/BucketAccessLogConfig'
          description: An object that describes the access log configuration for the bucket.
        cors:
          allOf:
          - $ref: '#/components/schemas/BucketCorsConfig'
          description: An array of cross-origin resource sharing (CORS) rules that identify origins and the HTTP
            methods that can be executed on your bucket. This field is only included in the response when CORS configuration
            is requested or when updating CORS configuration. For more information, see Configuring cross-origin
            resource sharing (CORS) .
      description: Describes an Amazon Lightsail bucket.
    BucketAccessLogConfig:
      type: object
      properties:
        enabled:
          allOf:
          - $ref: '#/components/schemas/boolean'
          description: A Boolean value that indicates whether bucket access logging is enabled for the bucket.
        destination:
          allOf:
          - $ref: '#/components/schemas/BucketName'
          description: The name of the bucket where the access logs are saved. The destination can be a Lightsail
            bucket in the same account, and in the same Amazon Web Services Region as the source bucket. This parameter
            is required when enabling the access log for a bucket, and should be omitted when disabling the access
            log.
        prefix:
          allOf:
          - $ref: '#/components/schemas/BucketAccessLogPrefix'
          description: The optional object prefix for the bucket access log. The prefix is an optional addition
            to the object key that organizes your access log files in the destination bucket. For example, if you
            specify a logs/ prefix, then each log object will begin with the logs/ prefix in its key (for example,
            logs/2021-11-01-21-32-16-E568B2907131C0C0 ). This parameter can be optionally specified when enabling
            the access log for a bucket, and should be omitted when disabling the access log.
      required:
      - enabled
      description: Describes the access log configuration for a bucket in the Amazon Lightsail object storage service.
        For more information about bucket access logs, see Logging bucket requests using access logging in Amazon
        Lightsail in the Amazon Lightsail Developer Guide .
    BucketAccessLogPrefix:
      type: string
      pattern: ^[\w/!.*')(-]+$
      minLength: 1
      maxLength: 100
    BucketBundle:
      type: object
      properties:
        bundleId:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The ID of the bundle.
        name:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The name of the bundle.
        price:
          allOf:
          - $ref: '#/components/schemas/float'
          description: The monthly price of the bundle, in US dollars.
        storagePerMonthInGb:
          allOf:
          - $ref: '#/components/schemas/integer'
          description: The storage size of the bundle, in GB.
        transferPerMonthInGb:
          allOf:
          - $ref: '#/components/schemas/integer'
          description: The monthly network transfer quota of the bundle.
        isActive:
          allOf:
          - $ref: '#/components/schemas/boolean'
          description: Indicates whether the bundle is active. Use for a new or existing bucket.
      description: Describes the specifications of a bundle that can be applied to an Amazon Lightsail bucket. A
        bucket bundle specifies the monthly cost, storage space, and data transfer quota for a bucket.
    BucketBundleList:
      type: array
      items:
        $ref: '#/components/schemas/BucketBundle'
    BucketCorsAllowedHeaders:
      type: array
      items:
        $ref: '#/components/schemas/string'
    BucketCorsAllowedMethod:
      type: string
      pattern: ^(DELETE|GET|HEAD|POST|PUT)$
    BucketCorsAllowedMethods:
      type: array
      items:
        $ref: '#/components/schemas/BucketCorsAllowedMethod'
    BucketCorsAllowedOrigins:
      type: array
      items:
        $ref: '#/components/schemas/string'
    BucketCorsConfig:
      type: object
      properties:
        rules:
          allOf:
          - $ref: '#/components/schemas/BucketCorsRules'
          description: A set of origins and methods (cross-origin access that you want to allow). You can add up
            to 20 rules to the configuration. The total size is limited to 64 KB.
      description: Describes the cross-origin resource sharing (CORS) configuration for a Lightsail bucket. CORS
        defines a way for client web applications that are loaded in one domain to interact with resources in a
        different domain. For more information, see Configuring cross-origin resource sharing (CORS) .
    BucketCorsExposeHeaders:
      type: array
      items:
        $ref: '#/components/schemas/string'
    BucketCorsRule:
      type: object
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/BucketCorsRuleId'
          description: A unique identifier for the CORS rule. The ID value can be up to 255 characters long. The
            IDs help you find a rule in the configuration.
        allowedMethods:
          allOf:
          - $ref: '#/components/schemas/BucketCorsAllowedMethods'
          description: 'The HTTP methods that are allowed when accessing the bucket from the specified origin. Each
            CORS rule must identify at least one origin and one method. You can use the following HTTP methods:
            GET - Retrieves data from the server, such as downloading files or viewing content. PUT - Uploads or
            replaces data on the server, such as uploading new files. POST - Sends data to the server for processing,
            such as submitting forms or creating new resources. DELETE - Removes data from the server, such as deleting
            files or resources. HEAD - Retrieves only the headers from the server without the actual content, useful
            for checking if a resource exists.'
        allowedOrigins:
          allOf:
          - $ref: '#/components/schemas/BucketCorsAllowedOrigins'
          description: One or more origins you want customers to be able to access the bucket from. Each CORS rule
            must identify at least one origin and one method.
        allowedHeaders:
          allOf:
          - $ref: '#/components/schemas/BucketCorsAllowedHeaders'
          description: Headers that are specified in the Access-Control-Request-Headers header. These headers are
            allowed in a preflight OPTIONS request. In response to any preflight OPTIONS request, Amazon S3 returns
            any requested headers that are allowed.
        exposeHeaders:
          allOf:
          - $ref: '#/components/schemas/BucketCorsExposeHeaders'
          description: One or more headers in the response that you want customers to be able to access from their
            applications (for example, from a JavaScript XMLHttpRequest object).
        maxAgeSeconds:
          allOf:
          - $ref: '#/components/schemas/integer'
          description: The time in seconds that your browser is to cache the preflight response for the specified
            resource. A CORS rule can have only one maxAgeSeconds element.
      required:
      - allowedMethods
      - allowedOrigins
      description: Describes a cross-origin resource sharing (CORS) rule for a Lightsail bucket. CORS rules specify
        which origins are allowed to access the bucket, which HTTP methods are allowed, and other access control
        information. For more information, see Configuring cross-origin resource sharing (CORS) .
    BucketCorsRuleId:
      type: string
      minLength: 0
      maxLength: 255
    BucketCorsRules:
      type: array
      items:
        $ref: '#/components/schemas/BucketCorsRule'
    BucketList:
      type: array
      items:
        $ref: '#/components/schemas/Bucket'
    BucketMetricName:
      type: string
      enum:
      - BucketSizeBytes
      - NumberOfObjects
    BucketName:
      type: string
      pattern: ^[a-z0-9][a-z0-9-]{1,52}[a-z0-9]$
      minLength: 3
      maxLength: 54
    BucketState:
      type: object
      properties:
        code:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: 'The state code of the bucket. The following codes are possible: OK - The bucket is in a
            running state. Unknown - Creation of the bucket might have timed-out. You might want to delete the bucket
            and create a new one.'
        message:
          allOf:
          - $ref: '#/components/schemas/string'
          description: A message that describes the state of the bucket.
      description: Describes the state of an Amazon Lightsail bucket.
    Bundle:
      type: object
      properties:
        price:
          allOf:
          - $ref: '#/components/schemas/float'
          description: The price in US dollars ( 5.0 ) of the bundle.
        cpuCount:
          allOf:
          - $ref: '#/components/schemas/integer'
          description: The number of vCPUs included in the bundle ( 2 ).
        diskSizeInGb:
          allOf:
          - $ref: '#/components/schemas/integer'
          description: The size of the SSD ( 30 ).
        bundleId:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The bundle ID ( micro_x_x ).
        instanceType:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The instance type ( micro ).
        isActive:
          allOf:
          - $ref: '#/components/schemas/boolean'
          description: A Boolean value indicating whether the bundle is active.
        name:
          allOf:
          - $ref: '#/components/schemas/string'
          description: A friendly name for the bundle ( Micro ).
        power:
          allOf:
          - $ref: '#/components/schemas/integer'
          description: A numeric value that represents the power of the bundle ( 500 ). You can use the bundle's
            power value in conjunction with a blueprint's minimum power value to determine whether the blueprint
            will run on the bundle. For example, you need a bundle with a power value of 500 or more to create an
            instance that uses a blueprint with a minimum power value of 500.
        ramSizeInGb:
          allOf:
          - $ref: '#/components/schemas/float'
          description: The amount of RAM in GB ( 2.0 ).
        transferPerMonthInGb:
          allOf:
          - $ref: '#/components/schemas/integer'
          description: The data transfer rate per month in GB ( 2000 ).
        supportedPlatforms:
          allOf:
          - $ref: '#/components/schemas/InstancePlatformList'
          description: The operating system platform (Linux/Unix-based or Windows Server-based) that the bundle
            supports. You can only launch a WINDOWS bundle on a blueprint that supports the WINDOWS platform. LINUX_UNIX
            blueprints require a LINUX_UNIX bundle.
        supportedAppCategories:
          allOf:
          - $ref: '#/components/schemas/AppCategoryList'
          description: Virtual computer blueprints that are supported by a Lightsail for Research bundle. This parameter
            only applies to Lightsail for Research resources.
        publicIpv4AddressCount:
          allOf:
          - $ref: '#/components/schemas/integer'
          description: An integer that indicates the public ipv4 address count included in the bundle, the value
            is either 0 or 1.
      description: Describes a bundle, which is a set of specs describing your virtual private server (or instance
        ).
    BundleList:
      type: array
      items:
        $ref: '#/components/schemas/Bundle'
    CacheBehavior:
      type: object
      properties:
        behavior:
          allOf:
          - $ref: '#/components/schemas/BehaviorEnum'
          description: 'The cache behavior of the distribution. The following cache behaviors can be specified:
            cache - This option is best for static sites. When specified, your distribution caches and serves your
            entire website as static content. This behavior is ideal for websites with static content that doesn''t
            change depending on who views it, or for websites that don''t use cookies, headers, or query strings
            to personalize content. dont-cache - This option is best for sites that serve a mix of static and dynamic
            content. When specified, your distribution caches and serve only the content that is specified in the
            distribution''s CacheBehaviorPerPath parameter. This behavior is ideal for websites or web applications
            that use cookies, headers, and query strings to personalize content for individual users.'
      description: Describes the default cache behavior of an Amazon Lightsail content delivery network (CDN) distribution.
    CacheBehaviorList:
      type: array
      items:
        $ref: '#/components/schemas/CacheBehaviorPerPath'
    CacheBehaviorPerPath:
      type: object
      properties:
        path:
          allOf:
          - $ref: '#/components/schemas/string'
          description: 'The path to a directory or file to cached, or not cache. Use an asterisk symbol to specify
            wildcard directories ( path/to/assets/* ), and file types ( *.html, *jpg, *js ). Directories and file
            paths are case-sensitive. Examples: Specify the following to cache all files in the document root of
            an Apache web server running on a Lightsail instance. var/www/html/ Specify the following file to cache
            only the index page in the document root of an Apache web server. var/www/html/index.html Specify the
            following to cache only the .html files in the document root of an Apache web server. var/www/html/*.html
            Specify the following to cache only the .jpg, .png, and .gif files in the images sub-directory of the
            document root of an Apache web server. var/www/html/images/*.jpg var/www/html/images/*.png var/www/html/images/*.gif
            Specify the following to cache all files in the images sub-directory of the document root of an Apache
            web server. var/www/html/images/'
        behavior:
          allOf:
          - $ref: '#/components/schemas/BehaviorEnum'
          description: 'The cache behavior for the specified path. You can specify one of the following per-path
            cache behaviors: cache - This behavior caches the specified path. dont-cache - This behavior doesn''t
            cache the specified path.'
      description: Describes the per-path cache behavior of an Amazon Lightsail content delivery network (CDN) distribution.
        A per-path cache behavior is used to override, or add an exception to, the default cache behavior of a distribution.
        For example, if the cacheBehavior is set to cache , then a per-path cache behavior can be used to specify
        a directory, file, or file type that your distribution will cache. Alternately, if the distribution's cacheBehavior
        is dont-cache , then a per-path cache behavior can be used to specify a directory, file, or file type that
        your distribution will not cache.
    CacheSettings:
      type: object
      properties:
        defaultTTL:
          allOf:
          - $ref: '#/components/schemas/long'
          description: The default amount of time that objects stay in the distribution's cache before the distribution
            forwards another request to the origin to determine whether the content has been updated. The value
            specified applies only when the origin does not add HTTP headers such as Cache-Control max-age , Cache-Control
            s-maxage , and Expires to objects.
        minimumTTL:
          allOf:
          - $ref: '#/components/schemas/long'
          description: The minimum amount of time that objects stay in the distribution's cache before the distribution
            forwards another request to the origin to determine whether the object has been updated. A value of
            0 must be specified for minimumTTL if the distribution is configured to forward all headers to the origin.
        maximumTTL:
          allOf:
          - $ref: '#/components/schemas/long'
          description: The maximum amount of time that objects stay in the distribution's cache before the distribution
            forwards another request to the origin to determine whether the object has been updated. The value specified
            applies only when the origin adds HTTP headers such as Cache-Control max-age , Cache-Control s-maxage
            , and Expires to objects.
        allowedHTTPMethods:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: 'The HTTP methods that are processed and forwarded to the distribution''s origin. You can
            specify the following options: GET,HEAD - The distribution forwards the GET and HEAD methods. GET,HEAD,OPTIONS
            - The distribution forwards the GET , HEAD , and OPTIONS methods. GET,HEAD,OPTIONS,PUT,PATCH,POST,DELETE
            - The distribution forwards the GET , HEAD , OPTIONS , PUT , PATCH , POST , and DELETE methods. If you
            specify the third option, you might need to restrict access to your distribution''s origin so users
            can''t perform operations that you don''t want them to. For example, you might not want users to have
            permission to delete objects from your origin.'
        cachedHTTPMethods:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: 'The HTTP method responses that are cached by your distribution. You can specify the following
            options: GET,HEAD - The distribution caches responses to the GET and HEAD methods. GET,HEAD,OPTIONS
            - The distribution caches responses to the GET , HEAD , and OPTIONS methods.'
        forwardedCookies:
          allOf:
          - $ref: '#/components/schemas/CookieObject'
          description: An object that describes the cookies that are forwarded to the origin. Your content is cached
            based on the cookies that are forwarded.
        forwardedHeaders:
          allOf:
          - $ref: '#/components/schemas/HeaderObject'
          description: An object that describes the headers that are forwarded to the origin. Your content is cached
            based on the headers that are forwarded.
        forwardedQueryStrings:
          allOf:
          - $ref: '#/components/schemas/QueryStringObject'
          description: An object that describes the query strings that are forwarded to the origin. Your content
            is cached based on the query strings that are forwarded.
      description: Describes the cache settings of an Amazon Lightsail content delivery network (CDN) distribution.
        These settings apply only to your distribution's cacheBehaviors (including the defaultCacheBehavior ) that
        have a behavior of cache .
    Certificate:
      type: object
      properties:
        arn:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The Amazon Resource Name (ARN) of the certificate.
        name:
          allOf:
          - $ref: '#/components/schemas/CertificateName'
          description: The name of the certificate ( my-certificate ).
        domainName:
          allOf:
          - $ref: '#/components/schemas/DomainName'
          description: The domain name of the certificate.
        status:
          allOf:
          - $ref: '#/components/schemas/CertificateStatus'
          description: The validation status of the certificate.
        serialNumber:
          allOf:
          - $ref: '#/components/schemas/SerialNumber'
          description: The serial number of the certificate.
        subjectAlternativeNames:
          allOf:
          - $ref: '#/components/schemas/SubjectAlternativeNameList'
          description: An array of strings that specify the alternate domains ( example2.com ) and subdomains (
            blog.example.com ) of the certificate.
        domainValidationRecords:
          allOf:
          - $ref: '#/components/schemas/DomainValidationRecordList'
          description: An array of objects that describe the domain validation records of the certificate.
        requestFailureReason:
          allOf:
          - $ref: '#/components/schemas/RequestFailureReason'
          description: 'The validation failure reason, if any, of the certificate. The following failure reasons
            are possible: NO_AVAILABLE_CONTACTS - This failure applies to email validation, which is not available
            for Lightsail certificates. ADDITIONAL_VERIFICATION_REQUIRED - Lightsail requires additional information
            to process this certificate request. This can happen as a fraud-protection measure, such as when the
            domain ranks within the Alexa top 1000 websites. To provide the required information, use the Amazon
            Web Services Support Center to contact Amazon Web Services Support. You cannot request a certificate
            for Amazon-owned domain names such as those ending in amazonaws.com, cloudfront.net, or elasticbeanstalk.com.
            DOMAIN_NOT_ALLOWED - One or more of the domain names in the certificate request was reported as an unsafe
            domain by VirusTotal . To correct the problem, search for your domain name on the VirusTotal website.
            If your domain is reported as suspicious, see Google Help for Hacked Websites to learn what you can
            do. If you believe that the result is a false positive, notify the organization that is reporting the
            domain. VirusTotal is an aggregate of several antivirus and URL scanners and cannot remove your domain
            from a block list itself. After you correct the problem and the VirusTotal registry has been updated,
            request a new certificate. If you see this error and your domain is not included in the VirusTotal list,
            visit the Amazon Web Services Support Center and create a case. INVALID_PUBLIC_DOMAIN - One or more
            of the domain names in the certificate request is not valid. Typically, this is because a domain name
            in the request is not a valid top-level domain. Try to request a certificate again, correcting any spelling
            errors or typos that were in the failed request, and ensure that all domain names in the request are
            for valid top-level domains. For example, you cannot request a certificate for example.invalidpublicdomain
            because invalidpublicdomain is not a valid top-level domain. OTHER - Typically, this failure occurs
            when there is a typographical error in one or more of the domain names in the certificate request. Try
            to request a certificate again, correcting any spelling errors or typos that were in the failed request.'
        inUseResourceCount:
          allOf:
          - $ref: '#/components/schemas/InUseResourceCount'
          description: The number of Lightsail resources that the certificate is attached to.
        keyAlgorithm:
          allOf:
          - $ref: '#/components/schemas/KeyAlgorithm'
          description: The algorithm used to generate the key pair (the public and private key) of the certificate.
        createdAt:
          allOf:
          - $ref: '#/components/schemas/IsoDate'
          description: The timestamp when the certificate was created.
        issuedAt:
          allOf:
          - $ref: '#/components/schemas/IsoDate'
          description: The timestamp when the certificate was issued.
        issuerCA:
          allOf:
          - $ref: '#/components/schemas/IssuerCA'
          description: The certificate authority that issued the certificate.
        notBefore:
          allOf:
          - $ref: '#/components/schemas/IsoDate'
          description: The timestamp when the certificate is first valid.
        notAfter:
          allOf:
          - $ref: '#/components/schemas/IsoDate'
          description: The timestamp when the certificate expires.
        eligibleToRenew:
          allOf:
          - $ref: '#/components/schemas/EligibleToRenew'
          description: The renewal eligibility of the certificate.
        renewalSummary:
          allOf:
          - $ref: '#/components/schemas/RenewalSummary'
          description: An object that describes the status of the certificate renewal managed by Lightsail.
        revokedAt:
          allOf:
          - $ref: '#/components/schemas/IsoDate'
          description: The timestamp when the certificate was revoked. This value is present only when the certificate
            status is REVOKED .
        revocationReason:
          allOf:
          - $ref: '#/components/schemas/RevocationReason'
          description: The reason the certificate was revoked. This value is present only when the certificate status
            is REVOKED .
        tags:
          allOf:
          - $ref: '#/components/schemas/TagList'
          description: The tag keys and optional values for the resource. For more information about tags in Lightsail,
            see the Amazon Lightsail Developer Guide .
        supportCode:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The support code. Include this code in your email to support when you have questions about
            your Lightsail certificate. This code enables our support team to look up your Lightsail information
            more easily.
      description: Describes the full details of an Amazon Lightsail SSL/TLS certificate. To get a summary of a
        certificate, use the GetCertificates action and omit includeCertificateDetails from your request. The response
        will include only the certificate Amazon Resource Name (ARN), certificate name, domain name, and tags.
    CertificateDomainValidationStatus:
      type: string
      enum:
      - PENDING_VALIDATION
      - FAILED
      - SUCCESS
    CertificateName:
      type: string
    CertificateProvider:
      type: string
      enum:
      - LetsEncrypt
    CertificateStatus:
      type: string
      enum:
      - PENDING_VALIDATION
      - ISSUED
      - INACTIVE
      - EXPIRED
      - VALIDATION_TIMED_OUT
      - REVOKED
      - FAILED
    CertificateStatusList:
      type: array
      items:
        $ref: '#/components/schemas/CertificateStatus'
    CertificateSummary:
      type: object
      properties:
        certificateArn:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The Amazon Resource Name (ARN) of the certificate.
        certificateName:
          allOf:
          - $ref: '#/components/schemas/CertificateName'
          description: The name of the certificate.
        domainName:
          allOf:
          - $ref: '#/components/schemas/DomainName'
          description: The domain name of the certificate.
        certificateDetail:
          allOf:
          - $ref: '#/components/schemas/Certificate'
          description: An object that describes a certificate in detail.
        tags:
          allOf:
          - $ref: '#/components/schemas/TagList'
          description: The tag keys and optional values for the resource. For more information about tags in Lightsail,
            see the Amazon Lightsail Developer Guide .
      description: Describes an Amazon Lightsail SSL/TLS certificate.
    CertificateSummaryList:
      type: array
      items:
        $ref: '#/components/schemas/CertificateSummary'
    CloseInstancePublicPortsRequest:
      type: object
      properties:
        portInfo:
          allOf:
          - $ref: '#/components/schemas/PortInfo'
          description: An object to describe the ports to close for the specified instance.
        instanceName:
          allOf:
          - $ref: '#/components/schemas/ResourceName'
          description: The name of the instance for which to close ports.
      required:
      - portInfo
      - instanceName
    CloseInstancePublicPortsResult:
      type: object
      properties:
        operation:
          allOf:
          - $ref: '#/components/schemas/Operation'
          description: An object that describes the result of the action, such as the status of the request, the
            timestamp of the request, and the resources affected by the request.
    CloudFormationStackRecord:
      type: object
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/ResourceName'
          description: The name of the CloudFormation stack record. It starts with CloudFormationStackRecord followed
            by a GUID.
        arn:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The Amazon Resource Name (ARN) of the CloudFormation stack record.
        createdAt:
          allOf:
          - $ref: '#/components/schemas/IsoDate'
          description: The date when the CloudFormation stack record was created.
        location:
          allOf:
          - $ref: '#/components/schemas/ResourceLocation'
          description: A list of objects describing the Availability Zone and Amazon Web Services Region of the
            CloudFormation stack record.
        resourceType:
          allOf:
          - $ref: '#/components/schemas/ResourceType'
          description: The Lightsail resource type ( CloudFormationStackRecord ).
        state:
          allOf:
          - $ref: '#/components/schemas/RecordState'
          description: The current state of the CloudFormation stack record.
        sourceInfo:
          allOf:
          - $ref: '#/components/schemas/CloudFormationStackRecordSourceInfoList'
          description: A list of objects describing the source of the CloudFormation stack record.
        destinationInfo:
          allOf:
          - $ref: '#/components/schemas/DestinationInfo'
          description: A list of objects describing the destination service, which is AWS CloudFormation, and the
            Amazon Resource Name (ARN) of the AWS CloudFormation stack.
      description: Describes a CloudFormation stack record created as a result of the create cloud formation stack
        action. A CloudFormation stack record provides information about the AWS CloudFormation stack used to create
        a new Amazon Elastic Compute Cloud instance from an exported Lightsail instance snapshot.
    CloudFormationStackRecordList:
      type: array
      items:
        $ref: '#/components/schemas/CloudFormationStackRecord'
    CloudFormationStackRecordSourceInfo:
      type: object
      properties:
        resourceType:
          allOf:
          - $ref: '#/components/schemas/CloudFormationStackRecordSourceType'
          description: The Lightsail resource type ( ExportSnapshotRecord ).
        name:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The name of the record.
        arn:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The Amazon Resource Name (ARN) of the export snapshot record.
      description: Describes the source of a CloudFormation stack record (i.e., the export snapshot record).
    CloudFormationStackRecordSourceInfoList:
      type: array
      items:
        $ref: '#/components/schemas/CloudFormationStackRecordSourceInfo'
    CloudFormationStackRecordSourceType:
      type: string
      enum:
      - ExportSnapshotRecord
    ComparisonOperator:
      type: string
      enum:
      - GreaterThanOrEqualToThreshold
      - GreaterThanThreshold
      - LessThanThreshold
      - LessThanOrEqualToThreshold
    ContactMethod:
      type: object
      properties:
        contactEndpoint:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The destination of the contact method, such as an email address or a mobile phone number.
        status:
          allOf:
          - $ref: '#/components/schemas/ContactMethodStatus'
          description: 'The current status of the contact method. A contact method has the following possible status:
            PendingVerification - The contact method has not yet been verified, and the verification has not yet
            expired. Valid - The contact method has been verified. InValid - An attempt was made to verify the contact
            method, but the verification has expired.'
        protocol:
          allOf:
          - $ref: '#/components/schemas/ContactProtocol'
          description: The protocol of the contact method, such as email or SMS (text messaging).
        name:
          allOf:
          - $ref: '#/components/schemas/ResourceName'
          description: The name of the contact method.
        arn:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The Amazon Resource Name (ARN) of the contact method.
        createdAt:
          allOf:
          - $ref: '#/components/schemas/IsoDate'
          description: The timestamp when the contact method was created.
        location:
          allOf:
          - $ref: '#/components/schemas/ResourceLocation'
          description: An object that describes the location of the contact method, such as the Amazon Web Services
            Region and Availability Zone.
        resourceType:
          allOf:
          - $ref: '#/components/schemas/ResourceType'
          description: The Lightsail resource type of the contact method.
        supportCode:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The support code. Include this code in your email to support when you have questions about
            your Lightsail contact method. This code enables our support team to look up your Lightsail information
            more easily.
        tags:
          allOf:
          - $ref: '#/components/schemas/TagList'
          description: The tag keys and optional values for the resource. For more information about tags in Lightsail,
            see the Amazon Lightsail Developer Guide .
      description: Describes a contact method. A contact method is a way to send you notifications. For more information,
        see Notifications in Amazon Lightsail .
    ContactMethodStatus:
      type: string
      enum:
      - PendingVerification
      - Valid
      - Invalid
    ContactMethodVerificationProtocol:
      type: string
      enum:
      - Email
    ContactMethodsList:
      type: array
      items:
        $ref: '#/components/schemas/ContactMethod'
    ContactProtocol:
      type: string
      enum:
      - Email
      - SMS
    ContactProtocolsList:
      type: array
      items:
        $ref: '#/components/schemas/ContactProtocol'
    Container:
      type: object
      properties:
        image:
          allOf:
          - $ref: '#/components/schemas/string'
          description: 'The name of the image used for the container. Container images sourced from your Lightsail
            container service, that are registered and stored on your service, start with a colon ( : ). For example,
            if your container service name is container-service-1 , the container image label is mystaticsite ,
            and you want to use the third ( 3 ) version of the registered container image, then you should specify
            :container-service-1.mystaticsite.3 . To use the latest version of a container image, specify latest
            instead of a version number (for example, :container-service-1.mystaticsite.latest ). Lightsail will
            automatically use the highest numbered version of the registered container image. Container images sourced
            from a public registry like Docker Hub don''t start with a colon. For example, nginx:latest or nginx
            .'
        command:
          allOf:
          - $ref: '#/components/schemas/StringList'
          description: The launch command for the container.
        environment:
          allOf:
          - $ref: '#/components/schemas/Environment'
          description: The environment variables of the container.
        ports:
          allOf:
          - $ref: '#/components/schemas/PortMap'
          description: The open firewall ports of the container.
      description: Describes the settings of a container that will be launched, or that is launched, to an Amazon
        Lightsail container service.
    ContainerImage:
      type: object
      properties:
        image:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The name of the container image.
        digest:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The digest of the container image.
        createdAt:
          allOf:
          - $ref: '#/components/schemas/IsoDate'
          description: The timestamp when the container image was created.
      description: Describes a container image that is registered to an Amazon Lightsail container service.
    ContainerImageList:
      type: array
      items:
        $ref: '#/components/schemas/ContainerImage'
    ContainerLabel:
      type: string
      pattern: ^[a-z0-9]{1,2}|[a-z0-9][a-z0-9-]+[a-z0-9]$
      minLength: 1
      maxLength: 53
    ContainerMap:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/Container'
    ContainerService:
      type: object
      properties:
        containerServiceName:
          allOf:
          - $ref: '#/components/schemas/ContainerServiceName'
          description: The name of the container service.
        arn:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The Amazon Resource Name (ARN) of the container service.
        createdAt:
          allOf:
          - $ref: '#/components/schemas/IsoDate'
          description: The timestamp when the container service was created.
        location:
          allOf:
          - $ref: '#/components/schemas/ResourceLocation'
          description: An object that describes the location of the container service, such as the Amazon Web Services
            Region and Availability Zone.
        resourceType:
          allOf:
          - $ref: '#/components/schemas/ResourceType'
          description: The Lightsail resource type of the container service.
        tags:
          allOf:
          - $ref: '#/components/schemas/TagList'
          description: The tag keys and optional values for the resource. For more information about tags in Lightsail,
            see the Amazon Lightsail Developer Guide .
        power:
          allOf:
          - $ref: '#/components/schemas/ContainerServicePowerName'
          description: The power specification of the container service. The power specifies the amount of RAM,
            the number of vCPUs, and the base price of the container service.
        powerId:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The ID of the power of the container service.
        state:
          allOf:
          - $ref: '#/components/schemas/ContainerServiceState'
          description: 'The current state of the container service. The following container service states are possible:
            PENDING - The container service is being created. READY - The container service is running but it does
            not have an active container deployment. DEPLOYING - The container service is launching a container
            deployment. RUNNING - The container service is running and it has an active container deployment. UPDATING
            - The container service capacity or its custom domains are being updated. DELETING - The container service
            is being deleted. DISABLED - The container service is disabled, and its active deployment and containers,
            if any, are shut down.'
        stateDetail:
          allOf:
          - $ref: '#/components/schemas/ContainerServiceStateDetail'
          description: An object that describes the current state of the container service. The state detail is
            populated only when a container service is in a PENDING , DEPLOYING , or UPDATING state.
        scale:
          allOf:
          - $ref: '#/components/schemas/ContainerServiceScale'
          description: The scale specification of the container service. The scale specifies the allocated compute
            nodes of the container service.
        currentDeployment:
          allOf:
          - $ref: '#/components/schemas/ContainerServiceDeployment'
          description: An object that describes the current container deployment of the container service.
        nextDeployment:
          allOf:
          - $ref: '#/components/schemas/ContainerServiceDeployment'
          description: An object that describes the next deployment of the container service. This value is null
            when there is no deployment in a pending state.
        isDisabled:
          allOf:
          - $ref: '#/components/schemas/boolean'
          description: A Boolean value indicating whether the container service is disabled.
        principalArn:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The principal ARN of the container service. The principal ARN can be used to create a trust
            relationship between your standard Amazon Web Services account and your Lightsail container service.
            This allows you to give your service permission to access resources in your standard Amazon Web Services
            account.
        privateDomainName:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The private domain name of the container service. The private domain name is accessible only
            by other resources within the default virtual private cloud (VPC) of your Lightsail account.
        publicDomainNames:
          allOf:
          - $ref: '#/components/schemas/ContainerServicePublicDomains'
          description: The public domain name of the container service, such as example.com and www.example.com
            . You can specify up to four public domain names for a container service. The domain names that you
            specify are used when you create a deployment with a container configured as the public endpoint of
            your container service. If you don't specify public domain names, then you can use the default domain
            of the container service. You must create and validate an SSL/TLS certificate before you can use public
            domain names with your container service. Use the CreateCertificate action to create a certificate for
            the public domain names you want to use with your container service. See CreateContainerService or UpdateContainerService
            for information about how to specify public domain names for your Lightsail container service.
        url:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The publicly accessible URL of the container service. If no public endpoint is specified
            in the currentDeployment , this URL returns a 404 response.
        privateRegistryAccess:
          allOf:
          - $ref: '#/components/schemas/PrivateRegistryAccess'
          description: An object that describes the configuration for the container service to access private container
            image repositories, such as Amazon Elastic Container Registry (Amazon ECR) private repositories. For
            more information, see Configuring access to an Amazon ECR private repository for an Amazon Lightsail
            container service in the Amazon Lightsail Developer Guide .
      description: Describes an Amazon Lightsail container service.
    ContainerServiceDeployment:
      type: object
      properties:
        version:
          allOf:
          - $ref: '#/components/schemas/integer'
          description: The version number of the deployment.
        state:
          allOf:
          - $ref: '#/components/schemas/ContainerServiceDeploymentState'
          description: 'The state of the deployment. A deployment can be in one of the following states: ACTIVATING
            - The deployment is being created. ACTIVE - The deployment was successfully created, and it''s currently
            running on the container service. The container service can have only one deployment in an active state
            at a time. INACTIVE - The deployment was previously successfully created, but it is not currently running
            on the container service. FAILED - The deployment failed. Use the GetContainerLog action to view the
            log events for the containers in the deployment to try to determine the reason for the failure.'
        containers:
          allOf:
          - $ref: '#/components/schemas/ContainerMap'
          description: An object that describes the configuration for the containers of the deployment.
        publicEndpoint:
          allOf:
          - $ref: '#/components/schemas/ContainerServiceEndpoint'
          description: An object that describes the endpoint of the deployment.
        createdAt:
          allOf:
          - $ref: '#/components/schemas/IsoDate'
          description: The timestamp when the deployment was created.
      description: Describes a container deployment configuration of an Amazon Lightsail container service. A deployment
        specifies the settings, such as the ports and launch command, of containers that are deployed to your container
        service.
    ContainerServiceDeploymentList:
      type: array
      items:
        $ref: '#/components/schemas/ContainerServiceDeployment'
    ContainerServiceDeploymentRequest:
      type: object
      properties:
        containers:
          allOf:
          - $ref: '#/components/schemas/ContainerMap'
          description: An object that describes the configuration for the containers of the deployment.
        publicEndpoint:
          allOf:
          - $ref: '#/components/schemas/EndpointRequest'
          description: An object that describes the endpoint of the deployment.
      description: Describes a container deployment configuration of an Amazon Lightsail container service. A deployment
        specifies the settings, such as the ports and launch command, of containers that are deployed to your container
        service.
    ContainerServiceDeploymentState:
      type: string
      enum:
      - ACTIVATING
      - ACTIVE
      - INACTIVE
      - FAILED
    ContainerServiceECRImagePullerRole:
      type: object
      properties:
        isActive:
          allOf:
          - $ref: '#/components/schemas/boolean'
          description: A Boolean value that indicates whether the role is activated.
        principalArn:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The Amazon Resource Name (ARN) of the role, if it is activated.
      description: Describes the activation status of the role that you can use to grant an Amazon Lightsail container
        service access to Amazon Elastic Container Registry (Amazon ECR) private repositories. When activated, Lightsail
        creates an Identity and Access Management (IAM) role for the specified Lightsail container service. You
        can use the ARN of the role to create a trust relationship between your Lightsail container service and
        an Amazon ECR private repository in your Amazon Web Services account. This allows your container service
        to pull images from Amazon ECR private repositories. For more information, see Configuring access to an
        Amazon ECR private repository for an Amazon Lightsail container service in the Amazon Lightsail Developer
        Guide .
    ContainerServiceECRImagePullerRoleRequest:
      type: object
      properties:
        isActive:
          allOf:
          - $ref: '#/components/schemas/boolean'
          description: A Boolean value that indicates whether to activate the role.
      description: Describes a request to activate or deactivate the role that you can use to grant an Amazon Lightsail
        container service access to Amazon Elastic Container Registry (Amazon ECR) private repositories. When activated,
        Lightsail creates an Identity and Access Management (IAM) role for the specified Lightsail container service.
        You can use the ARN of the role to create a trust relationship between your Lightsail container service
        and an Amazon ECR private repository in your Amazon Web Services account. This allows your container service
        to pull images from Amazon ECR private repositories. For more information, see Configuring access to an
        Amazon ECR private repository for an Amazon Lightsail container service in the Amazon Lightsail Developer
        Guide .
    ContainerServiceEndpoint:
      type: object
      properties:
        containerName:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The name of the container entry of the deployment that the endpoint configuration applies
            to.
        containerPort:
          allOf:
          - $ref: '#/components/schemas/integer'
          description: The port of the specified container to which traffic is forwarded to.
        healthCheck:
          allOf:
          - $ref: '#/components/schemas/ContainerServiceHealthCheckConfig'
          description: An object that describes the health check configuration of the container.
      description: Describes the public endpoint configuration of a deployment of an Amazon Lightsail container
        service.
    ContainerServiceHealthCheckConfig:
      type: object
      properties:
        healthyThreshold:
          allOf:
          - $ref: '#/components/schemas/integer'
          description: The number of consecutive health checks successes required before moving the container to
            the Healthy state. The default value is 2 .
        unhealthyThreshold:
          allOf:
          - $ref: '#/components/schemas/integer'
          description: The number of consecutive health check failures required before moving the container to the
            Unhealthy state. The default value is 2 .
        timeoutSeconds:
          allOf:
          - $ref: '#/components/schemas/integer'
          description: The amount of time, in seconds, during which no response means a failed health check. You
            can specify between 2 and 60 seconds. The default value is 2 .
        intervalSeconds:
          allOf:
          - $ref: '#/components/schemas/integer'
          description: The approximate interval, in seconds, between health checks of an individual container. You
            can specify between 5 and 300 seconds. The default value is 5 .
        path:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The path on the container on which to perform the health check. The default value is / .
        successCodes:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The HTTP codes to use when checking for a successful response from a container. You can specify
            values between 200 and 499 . You can specify multiple values (for example, 200,202 ) or a range of values
            (for example, 200-299 ).
      description: Describes the health check configuration of an Amazon Lightsail container service.
    ContainerServiceList:
      type: array
      items:
        $ref: '#/components/schemas/ContainerService'
    ContainerServiceLogEvent:
      type: object
      properties:
        createdAt:
          allOf:
          - $ref: '#/components/schemas/IsoDate'
          description: The timestamp when the container service log event was created.
        message:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The message of the container service log event.
