            ).
        supportCode:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The support code. Include this code in your email to support when you have questions about
            an instance or another resource in Lightsail. This code enables our support team to look up your Lightsail
            information more easily.
        createdAt:
          allOf:
          - $ref: '#/components/schemas/IsoDate'
          description: The timestamp when the snapshot was created ( 1479907467.024 ).
        location:
          allOf:
          - $ref: '#/components/schemas/ResourceLocation'
          description: The region name and Availability Zone where you created the snapshot.
        resourceType:
          allOf:
          - $ref: '#/components/schemas/ResourceType'
          description: The type of resource (usually InstanceSnapshot ).
        tags:
          allOf:
          - $ref: '#/components/schemas/TagList'
          description: The tag keys and optional values for the resource. For more information about tags in Lightsail,
            see the Amazon Lightsail Developer Guide .
        state:
          allOf:
          - $ref: '#/components/schemas/InstanceSnapshotState'
          description: The state the snapshot is in.
        progress:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The progress of the snapshot. This is populated only for disk snapshots, and is null for
            instance snapshots.
        fromAttachedDisks:
          allOf:
