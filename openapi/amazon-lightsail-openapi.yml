            the next maintenance window because this can result in an outage.
        disableBackupRetention:
          allOf:
          - $ref: '#/components/schemas/boolean'
          description: When true , disables automated backup retention for your database. Disabling backup retention
            deletes all automated database backups. Before disabling this, you may want to create a snapshot of
            your database using the create relational database snapshot operation. Updates are applied during the
            next maintenance window because this can result in an outage.
