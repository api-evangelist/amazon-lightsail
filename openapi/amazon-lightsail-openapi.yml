            is a 30-minute window selected at random from an 8-hour block of time for each Amazon Web Services Region,
            occurring on a random day of the week. Constraints: Must be in the ddd:hh24:mi-ddd:hh24:mi format. Valid
            days: Mon, Tue, Wed, Thu, Fri, Sat, Sun. Must be at least 30 minutes. Specified in Coordinated Universal
            Time (UTC). Example: Tue:17:00-Tue:17:30'
        enableBackupRetention:
          allOf:
