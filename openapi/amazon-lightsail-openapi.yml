  /ls/api/2016-11-28/CopySnapshot:
    post:
      operationId: CopySnapshot
      summary: Copies a manual snapshot of an instance or disk as another manual snapshot, or copies an automatic
        snapshot of an instance or disk as a manual snapshot
      description: Copies a manual snapshot of an instance or disk as another manual snapshot, or copies an automatic
        snapshot of an instance or disk as a manual snapshot. This operation can also be used to copy a manual or
        automatic snapshot of an instance or a disk from one Amazon Web Services Region to another in Amazon Lightsail.
        When copying a manual snapshot , be sure to define the source region , source snapshot name , and target
        snapshot name parameters. When copying an automatic snapshot , be sure to define the source region , source
        resource name , target snapshot name , and either the restore date or the use latest restorable auto snapshot
        parameters.
      tags:
