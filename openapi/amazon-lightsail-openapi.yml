        you create an SSL/TLS certificate for a Lightsail resource, you must add a set of CNAME records to the DNS
        of the domains for the certificate to validate that you own the domains. Lightsail can automatically add
        the CNAME records to the DNS of the domain if the DNS zone for the domain exists within your Lightsail account.
