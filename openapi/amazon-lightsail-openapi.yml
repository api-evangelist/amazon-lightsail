    HeaderEnum:
      type: string
      enum:
      - Accept
      - Accept-Charset
      - Accept-Datetime
      - Accept-Encoding
      - Accept-Language
      - Authorization
      - CloudFront-Forwarded-Proto
      - CloudFront-Is-Desktop-Viewer
      - CloudFront-Is-Mobile-Viewer
      - CloudFront-Is-SmartTV-Viewer
      - CloudFront-Is-Tablet-Viewer
      - CloudFront-Viewer-Country
      - Host
      - Origin
      - Referer
    HeaderForwardList:
      type: array
      items:
        $ref: '#/components/schemas/HeaderEnum'
    HeaderObject:
      type: object
      properties:
        option:
          allOf:
          - $ref: '#/components/schemas/ForwardValues'
          description: 'The headers that you want your distribution to forward to your origin and base caching on.
            You can configure your distribution to do one of the following: all - Forward all headers to your origin.
            none - Forward only the default headers. allow-list - Forward only the headers you specify using the
            headersAllowList parameter.'
        headersAllowList:
          allOf:
          - $ref: '#/components/schemas/HeaderForwardList'
          description: The specific headers to forward to your distribution's origin.
      description: Describes the request headers that a Lightsail distribution bases caching on. For the headers
        that you specify, your distribution caches separate versions of the specified content based on the header
        values in viewer requests. For example, suppose viewer requests for logo.jpg contain a custom product header
        that has a value of either acme or apex , and you configure your distribution to cache your content based
        on values in the product header. Your distribution forwards the product header to the origin and caches
        the response from the origin once for each header value.
    HostKeyAttributes:
      type: object
      properties:
        algorithm:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The SSH host key algorithm or the RDP certificate format. For SSH host keys, the algorithm
            may be ssh-rsa , ecdsa-sha2-nistp256 , ssh-ed25519 , etc. For RDP certificates, the algorithm is always
            x509-cert .
        publicKey:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The public SSH host key or the RDP certificate.
        witnessedAt:
          allOf:
          - $ref: '#/components/schemas/IsoDate'
          description: The time that the SSH host key or RDP certificate was recorded by Lightsail.
        fingerprintSHA1:
          allOf:
          - $ref: '#/components/schemas/string'
          description: 'The SHA-1 fingerprint of the returned SSH host key or RDP certificate. Example of an SHA-1
            SSH fingerprint: SHA1:1CHH6FaAaXjtFOsR/t83vf91SR0 Example of an SHA-1 RDP fingerprint: af:34:51:fe:09:f0:e0:da:b8:4e:56:ca:60:c2:10:ff:38:06:db:45'
        fingerprintSHA256:
          allOf:
          - $ref: '#/components/schemas/string'
          description: 'The SHA-256 fingerprint of the returned SSH host key or RDP certificate. Example of an SHA-256
            SSH fingerprint: SHA256:KTsMnRBh1IhD17HpdfsbzeGA4jOijm5tyXsMjKVbB8o Example of an SHA-256 RDP fingerprint:
            03:9b:36:9f:4b:de:4e:61:70:fc:7c:c9:78:e7:d2:1a:1c:25:a8:0c:91:f6:7c:e4:d6:a0:85:c8:b4:53:99:68'
        notValidBefore:
          allOf:
          - $ref: '#/components/schemas/IsoDate'
          description: The returned RDP certificate is valid after this point in time. This value is listed only
            for RDP certificates.
        notValidAfter:
          allOf:
          - $ref: '#/components/schemas/IsoDate'
          description: The returned RDP certificate is not valid after this point in time. This value is listed
            only for RDP certificates.
      description: Describes the public SSH host keys or the RDP certificate.
    HostKeysList:
      type: array
      items:
        $ref: '#/components/schemas/HostKeyAttributes'
    HttpEndpoint:
      type: string
      enum:
      - disabled
      - enabled
    HttpProtocolIpv6:
      type: string
      enum:
      - disabled
      - enabled
    HttpTokens:
      type: string
      enum:
      - optional
      - required
    IAMAccessKeyId:
      type: string
      pattern: ^[A-Z0-9]{20}$
      minLength: 20
      maxLength: 20
    ImportKeyPairRequest:
      type: object
      properties:
        keyPairName:
          allOf:
          - $ref: '#/components/schemas/ResourceName'
          description: The name of the key pair for which you want to import the public key.
        publicKeyBase64:
          allOf:
          - $ref: '#/components/schemas/Base64'
          description: A base64-encoded public key of the ssh-rsa type.
      required:
      - keyPairName
      - publicKeyBase64
    ImportKeyPairResult:
      type: object
      properties:
        operation:
          allOf:
          - $ref: '#/components/schemas/Operation'
          description: An array of objects that describe the result of the action, such as the status of the request,
            the timestamp of the request, and the resources affected by the request.
    InUseResourceCount:
      type: integer
    IncludeCertificateDetails:
      type: boolean
    InputOrigin:
      type: object
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/ResourceName'
          description: The name of the origin resource.
        regionName:
          allOf:
          - $ref: '#/components/schemas/RegionName'
          description: The AWS Region name of the origin resource.
        protocolPolicy:
          allOf:
          - $ref: '#/components/schemas/OriginProtocolPolicyEnum'
          description: The protocol that your Amazon Lightsail distribution uses when establishing a connection
            with your origin to pull content.
        responseTimeout:
          allOf:
          - $ref: '#/components/schemas/integer'
          description: The amount of time, in seconds, that the distribution waits for a response after forwarding
            a request to the origin. The minimum timeout is 1 second, the maximum is 60 seconds, and the default
            (if you don't specify otherwise) is 30 seconds.
        ipAddressType:
          allOf:
          - $ref: '#/components/schemas/OriginIpAddressTypeEnum'
          description: The IP address type that the distribution uses when connecting to the origin. The possible
            values are ipv4 for IPv4 only, ipv6 for IPv6 only, and dualstack for IPv4 and IPv6.
      description: Describes the origin resource of an Amazon Lightsail content delivery network (CDN) distribution.
        An origin can be a Lightsail instance, bucket, container service, or load balancer. A distribution pulls
        content from an origin, caches it, and serves it to viewers via a worldwide network of edge servers.
    Instance:
      type: object
      properties:
        name:
          allOf:
          - $ref: '#/components/schemas/ResourceName'
          description: The name the user gave the instance ( Amazon_Linux_2023-1 ).
        arn:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The Amazon Resource Name (ARN) of the instance ( arn:aws:lightsail:us-east-2:123456789101:Instance/244ad76f-8aad-4741-809f-12345EXAMPLE
            ).
        supportCode:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The support code. Include this code in your email to support when you have questions about
            an instance or another resource in Lightsail. This code enables our support team to look up your Lightsail
            information more easily.
        createdAt:
          allOf:
          - $ref: '#/components/schemas/IsoDate'
          description: The timestamp when the instance was created ( 1479734909.17 ) in Unix time format.
        location:
          allOf:
          - $ref: '#/components/schemas/ResourceLocation'
          description: The region name and Availability Zone where the instance is located.
        resourceType:
          allOf:
          - $ref: '#/components/schemas/ResourceType'
          description: The type of resource (usually Instance ).
        tags:
          allOf:
          - $ref: '#/components/schemas/TagList'
          description: The tag keys and optional values for the resource. For more information about tags in Lightsail,
            see the Amazon Lightsail Developer Guide .
        blueprintId:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The blueprint ID ( amazon_linux_2023 ).
        blueprintName:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The friendly name of the blueprint ( Amazon Linux 2023 ).
        bundleId:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The bundle for the instance ( micro_x_x ).
        addOns:
          allOf:
          - $ref: '#/components/schemas/AddOnList'
          description: An array of objects representing the add-ons enabled on the instance.
        isStaticIp:
          allOf:
          - $ref: '#/components/schemas/boolean'
          description: A Boolean value indicating whether this instance has a static IP assigned to it.
        privateIpAddress:
          allOf:
          - $ref: '#/components/schemas/IpAddress'
          description: The private IP address of the instance.
        publicIpAddress:
          allOf:
          - $ref: '#/components/schemas/IpAddress'
          description: The public IP address of the instance.
        ipv6Addresses:
          allOf:
          - $ref: '#/components/schemas/Ipv6AddressList'
          description: The IPv6 addresses of the instance.
        ipAddressType:
          allOf:
          - $ref: '#/components/schemas/IpAddressType'
          description: The IP address type of the instance. The possible values are ipv4 for IPv4 only, ipv6 for
            IPv6 only, and dualstack for IPv4 and IPv6.
        hardware:
          allOf:
          - $ref: '#/components/schemas/InstanceHardware'
          description: The size of the vCPU and the amount of RAM for the instance.
        networking:
          allOf:
          - $ref: '#/components/schemas/InstanceNetworking'
          description: Information about the public ports and monthly data transfer rates for the instance.
        state:
          allOf:
          - $ref: '#/components/schemas/InstanceState'
          description: The status code and the state ( running ) for the instance.
        username:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The user name for connecting to the instance ( ec2-user ).
        sshKeyName:
          allOf:
          - $ref: '#/components/schemas/ResourceName'
          description: The name of the SSH key being used to connect to the instance ( LightsailDefaultKeyPair ).
        metadataOptions:
          allOf:
          - $ref: '#/components/schemas/InstanceMetadataOptions'
          description: The metadata options for the Amazon Lightsail instance.
      description: Describes an instance (a virtual private server).
    InstanceAccessDetails:
      type: object
      properties:
        certKey:
          allOf:
          - $ref: '#/components/schemas/string'
          description: For SSH access, the public key to use when accessing your instance For OpenSSH clients (command
            line SSH), you should save this value to tempkey-cert.pub .
        expiresAt:
          allOf:
          - $ref: '#/components/schemas/IsoDate'
          description: For SSH access, the date on which the temporary keys expire.
        ipAddress:
          allOf:
          - $ref: '#/components/schemas/IpAddress'
          description: The public IP address of the Amazon Lightsail instance.
        ipv6Addresses:
          allOf:
          - $ref: '#/components/schemas/Ipv6AddressList'
          description: The IPv6 address of the Amazon Lightsail instance.
        password:
          allOf:
          - $ref: '#/components/schemas/string'
          description: For RDP access, the password for your Amazon Lightsail instance. Password will be an empty
            string if the password for your new instance is not ready yet. When you create an instance, it can take
            up to 15 minutes for the instance to be ready. If you create an instance using any key pair other than
            the default ( LightsailDefaultKeyPair ), password will always be an empty string. If you change the
            Administrator password on the instance, Lightsail will continue to return the original password value.
            When accessing the instance using RDP, you need to manually enter the Administrator password after changing
            it from the default.
        passwordData:
          allOf:
          - $ref: '#/components/schemas/PasswordData'
          description: For a Windows Server-based instance, an object with the data you can use to retrieve your
            password. This is only needed if password is empty and the instance is not new (and therefore the password
            is not ready yet). When you create an instance, it can take up to 15 minutes for the instance to be
            ready.
        privateKey:
          allOf:
          - $ref: '#/components/schemas/string'
          description: For SSH access, the temporary private key. For OpenSSH clients (command line SSH), you should
            save this value to tempkey ).
        protocol:
          allOf:
          - $ref: '#/components/schemas/InstanceAccessProtocol'
          description: The protocol for these Amazon Lightsail instance access details.
        instanceName:
          allOf:
          - $ref: '#/components/schemas/ResourceName'
          description: The name of this Amazon Lightsail instance.
        username:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The user name to use when logging in to the Amazon Lightsail instance.
        hostKeys:
          allOf:
          - $ref: '#/components/schemas/HostKeysList'
          description: Describes the public SSH host keys or the RDP certificate.
      description: The parameters for gaining temporary access to one of your Amazon Lightsail instances.
    InstanceAccessProtocol:
      type: string
      enum:
      - ssh
      - rdp
    InstanceEntry:
      type: object
      properties:
        sourceName:
          allOf:
          - $ref: '#/components/schemas/ResourceName'
          description: The name of the export snapshot record, which contains the exported Lightsail instance snapshot
            that will be used as the source of the new Amazon EC2 instance. Use the get export snapshot records
            operation to get a list of export snapshot records that you can use to create a CloudFormation stack.
        instanceType:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The instance type ( t2.micro ) to use for the new Amazon EC2 instance.
        portInfoSource:
          allOf:
          - $ref: '#/components/schemas/PortInfoSourceType'
          description: 'The port configuration to use for the new Amazon EC2 instance. The following configuration
            options are available: DEFAULT - Use the default firewall settings from the Lightsail instance blueprint.
            If this is specified, then IPv4 and IPv6 will be configured for the new instance that is created in
            Amazon EC2. INSTANCE - Use the configured firewall settings from the source Lightsail instance. If this
            is specified, the new instance that is created in Amazon EC2 will be configured to match the configuration
            of the source Lightsail instance. For example, if the source instance is configured for dual-stack (IPv4
            and IPv6), then IPv4 and IPv6 will be configured for the new instance that is created in Amazon EC2.
            If the source instance is configured for IPv4 only, then only IPv4 will be configured for the new instance
            that is created in Amazon EC2. NONE - Use the default Amazon EC2 security group. If this is specified,
            then only IPv4 will be configured for the new instance that is created in Amazon EC2. CLOSED - All ports
            closed. If this is specified, then only IPv4 will be configured for the new instance that is created
            in Amazon EC2. If you configured lightsail-connect as a cidrListAliases on your instance, or if you
            chose to allow the Lightsail browser-based SSH or RDP clients to connect to your instance, that configuration
            is not carried over to your new Amazon EC2 instance.'
        userData:
          allOf:
          - $ref: '#/components/schemas/string'
          description: A launch script you can create that configures a server with additional user data. For example,
            you might want to run apt-get -y update . Depending on the machine image you choose, the command to
            get software on your instance varies. Amazon Linux and CentOS use yum , Debian and Ubuntu use apt-get
            , and FreeBSD uses pkg .
        availabilityZone:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The Availability Zone for the new Amazon EC2 instance.
      required:
      - sourceName
      - instanceType
      - portInfoSource
      - availabilityZone
      description: Describes the Amazon Elastic Compute Cloud instance and related resources to be created using
        the create cloud formation stack operation.
    InstanceEntryList:
      type: array
      items:
        $ref: '#/components/schemas/InstanceEntry'
    InstanceHardware:
      type: object
      properties:
        cpuCount:
          allOf:
          - $ref: '#/components/schemas/integer'
          description: The number of vCPUs the instance has.
        disks:
          allOf:
          - $ref: '#/components/schemas/DiskList'
          description: The disks attached to the instance.
        ramSizeInGb:
          allOf:
          - $ref: '#/components/schemas/float'
          description: The amount of RAM in GB on the instance ( 1.0 ).
      description: Describes the hardware for the instance.
    InstanceHealthReason:
      type: string
      enum:
      - Lb.RegistrationInProgress
      - Lb.InitialHealthChecking
      - Lb.InternalError
      - Instance.ResponseCodeMismatch
      - Instance.Timeout
      - Instance.FailedHealthChecks
      - Instance.NotRegistered
      - Instance.NotInUse
      - Instance.DeregistrationInProgress
      - Instance.InvalidState
      - Instance.IpUnusable
    InstanceHealthState:
      type: string
      enum:
      - initial
      - healthy
      - unhealthy
      - unused
      - draining
      - unavailable
    InstanceHealthSummary:
      type: object
      properties:
        instanceName:
          allOf:
          - $ref: '#/components/schemas/ResourceName'
          description: The name of the Lightsail instance for which you are requesting health check data.
        instanceHealth:
          allOf:
          - $ref: '#/components/schemas/InstanceHealthState'
          description: Describes the overall instance health. Valid values are below.
        instanceHealthReason:
          allOf:
          - $ref: '#/components/schemas/InstanceHealthReason'
          description: 'More information about the instance health. If the instanceHealth is healthy , then an instanceHealthReason
            value is not provided. If instanceHealth is initial , the instanceHealthReason value can be one of the
            following: Lb.RegistrationInProgress - The target instance is in the process of being registered with
            the load balancer. Lb.InitialHealthChecking - The Lightsail load balancer is still sending the target
            instance the minimum number of health checks required to determine its health status. If instanceHealth
            is unhealthy , the instanceHealthReason value can be one of the following: Instance.ResponseCodeMismatch
            - The health checks did not return an expected HTTP code. Instance.Timeout - The health check requests
            timed out. Instance.FailedHealthChecks - The health checks failed because the connection to the target
            instance timed out, the target instance response was malformed, or the target instance failed the health
            check for an unknown reason. Lb.InternalError - The health checks failed due to an internal error. If
            instanceHealth is unused , the instanceHealthReason value can be one of the following: Instance.NotRegistered
            - The target instance is not registered with the target group. Instance.NotInUse - The target group
            is not used by any load balancer, or the target instance is in an Availability Zone that is not enabled
            for its load balancer. Instance.IpUnusable - The target IP address is reserved for use by a Lightsail
            load balancer. Instance.InvalidState - The target is in the stopped or terminated state. If instanceHealth
            is draining , the instanceHealthReason value can be one of the following: Instance.DeregistrationInProgress
            - The target instance is in the process of being deregistered and the deregistration delay period has
            not expired.'
      description: Describes information about the health of the instance.
    InstanceHealthSummaryList:
      type: array
      items:
        $ref: '#/components/schemas/InstanceHealthSummary'
    InstanceList:
      type: array
      items:
        $ref: '#/components/schemas/Instance'
    InstanceMetadataOptions:
      type: object
      properties:
        state:
          allOf:
          - $ref: '#/components/schemas/InstanceMetadataState'
          description: 'The state of the metadata option changes. The following states are possible: pending - The
            metadata options are being updated. The instance is not yet ready to process metadata traffic with the
            new selection. applied - The metadata options have been successfully applied to the instance.'
        httpTokens:
          allOf:
          - $ref: '#/components/schemas/HttpTokens'
          description: The state of token usage for your instance metadata requests. If the state is optional ,
            you can choose whether to retrieve instance metadata with a signed token header on your request. If
            you retrieve the IAM role credentials without a token, the version 1.0 role credentials are returned.
            If you retrieve the IAM role credentials by using a valid signed token, the version 2.0 role credentials
            are returned. If the state is required , you must send a signed token header with all instance metadata
            retrieval requests. In this state, retrieving the IAM role credential always returns the version 2.0
            credentials. The version 1.0 credentials are not available. Not all instance blueprints in Lightsail
            support version 2.0 credentials. Use the MetadataNoToken instance metric to track the number of calls
            to the instance metadata service that are using version 1.0 credentials. For more information, see Viewing
            instance metrics in Amazon Lightsail in the Amazon Lightsail Developer Guide .
        httpEndpoint:
          allOf:
          - $ref: '#/components/schemas/HttpEndpoint'
          description: Indicates whether the HTTP metadata endpoint on your instances is enabled or disabled. If
            the value is disabled , you cannot access your instance metadata.
        httpPutResponseHopLimit:
          allOf:
          - $ref: '#/components/schemas/integer'
          description: The desired HTTP PUT response hop limit for instance metadata requests. A larger number means
            that the instance metadata requests can travel farther.
        httpProtocolIpv6:
          allOf:
          - $ref: '#/components/schemas/HttpProtocolIpv6'
          description: Indicates whether the IPv6 endpoint for the instance metadata service is enabled or disabled.
      description: The metadata options for the instance.
    InstanceMetadataState:
      type: string
      enum:
      - pending
      - applied
    InstanceMetricName:
      type: string
      enum:
      - CPUUtilization
      - NetworkIn
      - NetworkOut
      - StatusCheckFailed
      - StatusCheckFailed_Instance
      - StatusCheckFailed_System
      - BurstCapacityTime
      - BurstCapacityPercentage
      - MetadataNoToken
    InstanceNetworking:
      type: object
      properties:
        monthlyTransfer:
          allOf:
          - $ref: '#/components/schemas/MonthlyTransfer'
          description: The amount of data in GB allocated for monthly data transfers.
        ports:
          allOf:
          - $ref: '#/components/schemas/InstancePortInfoList'
          description: An array of key-value pairs containing information about the ports on the instance.
      description: Describes monthly data transfer rates and port information for an instance.
    InstancePlatform:
      type: string
      enum:
      - LINUX_UNIX
      - WINDOWS
    InstancePlatformList:
      type: array
      items:
        $ref: '#/components/schemas/InstancePlatform'
    InstancePortInfo:
      type: object
      properties:
        fromPort:
          allOf:
          - $ref: '#/components/schemas/Port'
          description: 'The first port in a range of open ports on an instance. Allowed ports: TCP and UDP - 0 to
            65535 ICMP - The ICMP type for IPv4 addresses. For example, specify 8 as the fromPort (ICMP type), and
            -1 as the toPort (ICMP code), to enable ICMP Ping. For more information, see Control Messages on Wikipedia
            . ICMPv6 - The ICMP type for IPv6 addresses. For example, specify 128 as the fromPort (ICMPv6 type),
            and 0 as toPort (ICMPv6 code). For more information, see Internet Control Message Protocol for IPv6
            .'
        toPort:
          allOf:
          - $ref: '#/components/schemas/Port'
          description: 'The last port in a range of open ports on an instance. Allowed ports: TCP and UDP - 0 to
            65535 ICMP - The ICMP code for IPv4 addresses. For example, specify 8 as the fromPort (ICMP type), and
            -1 as the toPort (ICMP code), to enable ICMP Ping. For more information, see Control Messages on Wikipedia
            . ICMPv6 - The ICMP code for IPv6 addresses. For example, specify 128 as the fromPort (ICMPv6 type),
            and 0 as toPort (ICMPv6 code). For more information, see Internet Control Message Protocol for IPv6
            .'
        protocol:
          allOf:
          - $ref: '#/components/schemas/NetworkProtocol'
          description: 'The IP protocol name. The name can be one of the following: tcp - Transmission Control Protocol
            (TCP) provides reliable, ordered, and error-checked delivery of streamed data between applications running
            on hosts communicating by an IP network. If you have an application that doesn''t require reliable data
            stream service, use UDP instead. all - All transport layer protocol types. For more general information,
            see Transport layer on Wikipedia . udp - With User Datagram Protocol (UDP), computer applications can
            send messages (or datagrams) to other hosts on an Internet Protocol (IP) network. Prior communications
            are not required to set up transmission channels or data paths. Applications that don''t require reliable
            data stream service can use UDP, which provides a connectionless datagram service that emphasizes reduced
            latency over reliability. If you do require reliable data stream service, use TCP instead. icmp - Internet
            Control Message Protocol (ICMP) is used to send error messages and operational information indicating
            success or failure when communicating with an instance. For example, an error is indicated when an instance
            could not be reached. When you specify icmp as the protocol , you must specify the ICMP type using the
            fromPort parameter, and ICMP code using the toPort parameter. icmp6 - Internet Control Message Protocol
            (ICMP) for IPv6. When you specify icmp6 as the protocol , you must specify the ICMP type using the fromPort
            parameter, and ICMP code using the toPort parameter.'
        accessFrom:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The location from which access is allowed. For example, Anywhere (0.0.0.0/0) , or Custom
            if a specific IP address or range of IP addresses is allowed.
        accessType:
          allOf:
          - $ref: '#/components/schemas/PortAccessType'
          description: The type of access ( Public or Private ).
        commonName:
          allOf:
          - $ref: '#/components/schemas/string'
          description: The common name of the port information.
        accessDirection:
          allOf:
          - $ref: '#/components/schemas/AccessDirection'
          description: The access direction ( inbound or outbound ). Lightsail currently supports only inbound access
            direction.
        cidrs:
          allOf:
          - $ref: '#/components/schemas/StringList'
          description: The IPv4 address, or range of IPv4 addresses (in CIDR notation) that are allowed to connect
            to an instance through the ports, and the protocol. The ipv6Cidrs parameter lists the IPv6 addresses
            that are allowed to connect to an instance. For more information about CIDR block notation, see Classless
            Inter-Domain Routing on Wikipedia .
        ipv6Cidrs:
          allOf:
          - $ref: '#/components/schemas/StringList'
          description: The IPv6 address, or range of IPv6 addresses (in CIDR notation) that are allowed to connect
            to an instance through the ports, and the protocol. Only devices with an IPv6 address can connect to
            an instance through IPv6; otherwise, IPv4 should be used. The cidrs parameter lists the IPv4 addresses
            that are allowed to connect to an instance. For more information about CIDR block notation, see Classless
            Inter-Domain Routing on Wikipedia .
        cidrListAliases:
          allOf:
          - $ref: '#/components/schemas/StringList'
          description: An alias that defines access for a preconfigured range of IP addresses. The only alias currently
            supported is lightsail-connect , which allows IP addresses of the browser-based RDP/SSH client in the
            Lightsail console to connect to your instance.
      description: Describes information about ports for an Amazon Lightsail instance.
