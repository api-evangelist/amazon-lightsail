          description: The load balancer name where your SSL/TLS certificate is attached.
        isAttached:
          allOf:
          - $ref: '#/components/schemas/boolean'
          description: When true , the SSL/TLS certificate is attached to the Lightsail load balancer.
        status:
          allOf:
          - $ref: '#/components/schemas/LoadBalancerTlsCertificateStatus'
          description: The validation status of the SSL/TLS certificate. Valid values are below.
        domainName:
          allOf:
          - $ref: '#/components/schemas/DomainName'
          description: The domain name for your SSL/TLS certificate.
        domainValidationRecords:
          allOf:
          - $ref: '#/components/schemas/LoadBalancerTlsCertificateDomainValidationRecordList'
          description: An array of LoadBalancerTlsCertificateDomainValidationRecord objects describing the records.
        failureReason:
          allOf:
          - $ref: '#/components/schemas/LoadBalancerTlsCertificateFailureReason'
          description: 'The validation failure reason, if any, of the certificate. The following failure reasons
            are possible: NO_AVAILABLE_CONTACTS - This failure applies to email validation, which is not available
            for Lightsail certificates. ADDITIONAL_VERIFICATION_REQUIRED - Lightsail requires additional information
            to process this certificate request. This can happen as a fraud-protection measure, such as when the
            domain ranks within the Alexa top 1000 websites. To provide the required information, use the AWS Support
            Center to contact AWS Support. You cannot request a certificate for Amazon-owned domain names such as
            those ending in amazonaws.com, cloudfront.net, or elasticbeanstalk.com. DOMAIN_NOT_ALLOWED - One or
            more of the domain names in the certificate request was reported as an unsafe domain by VirusTotal .
            To correct the problem, search for your domain name on the VirusTotal website. If your domain is reported
            as suspicious, see Google Help for Hacked Websites to learn what you can do. If you believe that the
            result is a false positive, notify the organization that is reporting the domain. VirusTotal is an aggregate
            of several antivirus and URL scanners and cannot remove your domain from a block list itself. After
            you correct the problem and the VirusTotal registry has been updated, request a new certificate. If
            you see this error and your domain is not included in the VirusTotal list, visit the AWS Support Center
            and create a case. INVALID_PUBLIC_DOMAIN - One or more of the domain names in the certificate request
            is not valid. Typically, this is because a domain name in the request is not a valid top-level domain.
            Try to request a certificate again, correcting any spelling errors or typos that were in the failed
            request, and ensure that all domain names in the request are for valid top-level domains. For example,
            you cannot request a certificate for example.invalidpublicdomain because invalidpublicdomain is not
            a valid top-level domain. OTHER - Typically, this failure occurs when there is a typographical error
            in one or more of the domain names in the certificate request. Try to request a certificate again, correcting
            any spelling errors or typos that were in the failed request.'
        issuedAt:
          allOf:
          - $ref: '#/components/schemas/IsoDate'
          description: The time when the SSL/TLS certificate was issued.
        issuer:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The issuer of the certificate.
        keyAlgorithm:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The algorithm used to generate the key pair (the public and private key).
        notAfter:
          allOf:
          - $ref: '#/components/schemas/IsoDate'
          description: The timestamp when the SSL/TLS certificate expires.
        notBefore:
          allOf:
          - $ref: '#/components/schemas/IsoDate'
          description: The timestamp when the SSL/TLS certificate is first valid.
        renewalSummary:
          allOf:
          - $ref: '#/components/schemas/LoadBalancerTlsCertificateRenewalSummary'
          description: An object that describes the status of the certificate renewal managed by Lightsail.
        revocationReason:
          allOf:
          - $ref: '#/components/schemas/LoadBalancerTlsCertificateRevocationReason'
          description: The reason the certificate was revoked. This value is present only when the certificate status
            is REVOKED .
        revokedAt:
          allOf:
          - $ref: '#/components/schemas/IsoDate'
          description: The timestamp when the certificate was revoked. This value is present only when the certificate
            status is REVOKED .
        serial:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The serial number of the certificate.
        signatureAlgorithm:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The algorithm that was used to sign the certificate.
        subject:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          description: The name of the entity that is associated with the public key contained in the certificate.
        subjectAlternativeNames:
          allOf:
          - $ref: '#/components/schemas/StringList'
          description: An array of strings that specify the alternate domains ( example2.com ) and subdomains (
            blog.example.com ) for the certificate.
