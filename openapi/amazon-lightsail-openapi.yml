      description: Returns information about the configured alarms. Specify an alarm name in your request to return
        information about a specific alarm, or specify a monitored resource name to return information about all
        alarms for a specific resource. An alarm is used to monitor a single metric for one of your resources. When
        a metric condition is met, the alarm can notify you by email, SMS text message, and a banner displayed on
        the Amazon Lightsail console. For more information, see Alarms in Amazon Lightsail .
