mcp_only:
- tool: aws___get_tasks
  reason: MCP session bookkeeping for long-running run_script tasks. No Lightsail equivalent.
- tool: aws___get_presigned_url
  reason: Amazon S3 pre-signed URL helper. Lightsail buckets use their own CreateBucketAccessKey / GetBucketAccessKeys
    operations instead.
- tool: aws___list_regions
  reason: AWS-wide region list. Lightsail answers the Lightsail-scoped version first-party with GetRegions,
    which the tool does not call.
- tool: aws___get_regional_availability
  reason: AWS-wide resource availability. Lightsail bundle availability per region comes from GetBundles /
    GetBlueprints instead.
- tool: aws___retrieve_skill
  reason: Returns pre-built AWS agent SOPs. Not bound to any Lightsail operation.
