provider: Amazon Lightsail
providerId: amazon-lightsail
note: 'Amazon Lightsail has no MCP tool of its own, so this crosswalk records a shape the catalog should be
  able to distinguish: EVERY one of the 162 published operations is rest_only, and the single binding that
  reaches them is a generic AWS script executor. An agent cannot discover CreateInstances or GetContainerLog
  from the MCP surface — it has to already know the boto3 client name ("lightsail") and the operation name,
  then hand them to aws___run_script. That is a real, working path and a materially weaker one than a named
  tool carrying the operation''s inputSchema. Confidence on the one binding is high because the executor''s
  own inputSchema (saved verbatim in amazon-lightsail-aws-mcp-tools-list.json) documents call_boto3; confidence
  on per-operation coverage is not a question this surface can answer, because nothing enumerates it.'
