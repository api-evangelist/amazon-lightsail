name: Amazon Lightsail
description: >-
  Amazon Lightsail is a virtual private server (VPS) provider and is the
  easiest way to get started with AWS for developers, small businesses,
  students, and other users who need a solution to build and host their
  applications on cloud. Lightsail provides developers compute, storage,
  and networking capacity and capabilities to deploy and manage websites
  and web applications in the cloud. Lightsail includes everything you
  need to launch your project quickly - instances, containers, databases,
  content delivery network (CDN), load balancers, DNS management - for a
  low, predictable monthly price.
image: https://a0.awsstatic.com/libra-css/images/logos/aws_logo_smile_1200x630.png
url: https://apis.io/amazon-lightsail
