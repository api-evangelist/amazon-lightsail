name: Amazon Lightsail
description: Amazon Lightsail is a virtual private server (VPS) provider and is the easiest way to get started with
  AWS for developers, small businesses, students, and other users who need a solution to build and host their applications
  on cloud. Lightsail provides developers compute, storage, and networking capacity and capabilities to deploy and
  manage websites and web applications in the cloud.
