naftiko: 1.0.0-alpha2
info:
  label: Amazon Lightsail Workflow
  description: Unified workflow capability for Amazon Lightsail combining resource management and operations.
  tags:
  - Amazon Lightsail
  - AWS
  - Workflow
  created: '2026-04-19'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    AWS_ACCESS_KEY_ID: AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: AWS_SECRET_ACCESS_KEY
capability:
  consumes:
  - type: http
    namespace: lightsail
    baseUri: https://lightsail.us-east-1.amazonaws.com
    description: Amazon Lightsail service.
    authentication:
      type: apikey
      key: Authorization
      value: '{{AWS_ACCESS_KEY_ID}}'
      placement: header
    resources:
    - name: instances
      path: /instances
      description: Lightsail virtual server instance management
      operations:
      - name: createinstances
        method: POST
        description: Creates one or more Amazon Lightsail instances.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: getinstances
        method: GET
        description: Returns information about all Amazon Lightsail virtual private servers.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: getinstance
        method: GET
        description: Returns information about a specific Amazon Lightsail instance.
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: lightsail-api
    description: REST API for Amazon Lightsail workflow.
    resources: []
  - type: mcp
    port: 9090
    namespace: lightsail-mcp
    transport: http
    description: MCP server for Amazon Lightsail.
    tools:
    - name: instances-create-instances
      description: Creates one or more Amazon Lightsail instances.
      hints:
        readOnly: false
        idempotent: false
      call: lightsail.createinstances
      outputParameters:
      - type: object
        mapping: $.
    - name: instances-get-instances
      description: Returns information about all Amazon Lightsail virtual private servers.
      hints:
        readOnly: true
        idempotent: true
      call: lightsail.getinstances
      outputParameters:
      - type: object
        mapping: $.
    - name: instances-get-instance
      description: Returns information about a specific Amazon Lightsail instance.
      hints:
        readOnly: true
        idempotent: true
      call: lightsail.getinstance
      outputParameters:
      - type: object
        mapping: $.
