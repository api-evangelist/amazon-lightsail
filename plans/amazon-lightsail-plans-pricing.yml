provider: Amazon Lightsail
providerId: amazon-lightsail
note: 'Lightsail''s entire commercial proposition is a fixed monthly price, so its plans are instance BUNDLES,
  not API tiers: the API itself is free to call and carries no per-request charge, no request quota and no
  paid API tier. What a buyer picks is a bundle — vCPUs, memory, SSD storage and a monthly data-transfer allowance
  — billed on an on-demand hourly rate capped at the monthly figure below. The IPv6-only variants are the same
  machine without a public IPv4 address and are consistently $1.50-$4.00 a month cheaper, which is the AWS
  public-IPv4 charge showing through. Prices below are the published us-east-1 list prices and vary by AWS
  Region. Bundles for the other Lightsail resource types (managed databases, buckets, CDN distributions, load
  balancers) are priced on their own pages and are not enumerated here; the API reads all of them at runtime
  through GetBundles, GetRelationalDatabaseBundles, GetBucketBundles and GetDistributionBundles.'
api_pricing:
  model: free
  detail: No charge for Lightsail API requests. Billing is for provisioned resources only.
free_tier:
  available: true
  detail: AWS Free Tier includes three months free on selected Lightsail bundles for new accounts.
  source: https://aws.amazon.com/lightsail/pricing/
