generated: '2026-09-17'
method: searched
source: https://docs.aws.amazon.com/cli/latest/reference/lightsail/index.html (AWS CLI 2.36.48 command reference,
  fetched 2026-09-17 HTTP 200) and https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-install-software.html
  (HTTP 200); the command list is the 1:1 kebab-case projection of the 162 operations in openapi/amazon-lightsail-openapi.yml,
  which is how the AWS CLI is generated from the same service model.
provider: Amazon Lightsail
providerId: amazon-lightsail
name: AWS CLI — lightsail
binary: aws
namespace: aws lightsail
official: true
note: 'Lightsail has no CLI of its own; it is a namespace inside the AWS CLI, generated from the same Smithy
  model as the SDKs, so every one of the 162 API operations has a command and the mapping is mechanical (GetInstances
  -> `aws lightsail get-instances`). There IS a second, Lightsail-specific first-party binary: lightsailctl,
  the Lightsail Control plugin, which the AWS CLI shells out to when a container-service command needs to push
  a local container image. Without it, `aws lightsail push-container-image` does not work — which makes it
  the one piece of Lightsail tooling a container user must install separately and the most common setup failure
  on that surface.'
install:
- method: AWS CLI v2 installer
  platform: macOS / Linux / Windows
  url: https://docs.aws.amazon.com/cli/latest/userguide/getting-started-install.html
  note: Signed platform installer from awscli.amazonaws.com. The version AWS recommends.
- method: pip
  platform: any
  command: pip install awscli
  note: AWS CLI v1 only; see packages/.
plugins:
- name: lightsailctl
  description: Lightsail Control plugin. Required by the AWS CLI to push a local container image to a Lightsail
    container service.
  official: true
  url: https://docs.aws.amazon.com/lightsail/latest/userguide/amazon-lightsail-install-software.html
  required_for:
  - push-container-image
auth:
  mechanism: AWS IAM credentials via `aws configure`, environment variables, SSO or an instance role
  profile_flag: --profile
  region_flag: --region
  note: Lightsail is regional; --region is load-bearing, and domain/distribution commands must target us-east-1.
common_flags:
- --region
- --profile
- --output json|text|table
- --query <JMESPath>
- --no-cli-pager
- --debug
