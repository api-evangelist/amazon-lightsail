note: >-
  Lightsail publishes a dated documentation history, not an API changelog: the entries record what
  changed in the docs, and a service change is visible only where it forced a doc change. The page is
  itself young — its first entry, on 2025-07-30, is the announcement that Lightsail started tracking
  documentation updates at all — so there is no history before that date, and the seven entries below
  are the complete published record rather than a recent window. None of them is a breaking API change;
  every one is additive (new bundles, CORS support on buckets, a new Region) or editorial. Broader
  service announcements appear in the AWS What's New feed and the AWS Compute Blog, neither of which is
  Lightsail-scoped. The most recent entry is 2025-10-31, ten and a half months before this pass.
